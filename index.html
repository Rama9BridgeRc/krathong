<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a22">
<title>ลอยกระทงออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   🔴 [จุดที่ต้องแก้ไข] นำลิงก์ Web App (/exec) จาก Google Apps Script มาใส่ที่นี่
   ===================================================================== */
var APP_CONFIG = {
  GAS_API_URL: 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec',

  // ค่าสำรองระหว่างรอโหลดข้อมูลจาก Google Sheets
  FALLBACK_CFG: {
    orgName: 'องค์กร / โรงเรียน / ชุมชนของคุณ',
    title: 'ลอยกระทงออนไลน์ ๒๕๖๙',
    subtitle: 'ร่วมสืบสานประเพณีไทย อธิษฐานขอพรผ่านสายน้ำแห่งความสุข',
    buttonText: 'เริ่มลอยกระทง',
    footer: 'ร่วมอนุรักษ์สิ่งแวดล้อม ลอยกระทงออนไลน์ลดขยะในแม่น้ำ',
    logo: '',
    eventOpen: true,
    closedText: 'ขณะนี้ปิดรับการลอยกระทงแล้ว ขอบคุณที่ร่วมกิจกรรม',
    thanksText: 'ขออำนาจคุณพระศรีรัตนตรัยและสิ่งศักดิ์สิทธิ์ ดลบันดาลให้คำอธิษฐานของคุณเป็นจริง',
    accent: '#f4c565',
    waterColor: '#08184a',
    flow: 'right',
    reflection: true,
    lanterns: true,
    bgImage: '',
    bgImageMobile: '',
    bgFocusX: 50,
    bgFocusY: 100,
    dim: 15,
    horizon: 0,
    horizonMobile: 0,
    music: '',
    maxOnScreen: 36,
    ambient: 10,
    pollSeconds: 5,
    appUrl: '',
    qrNote: 'สแกน QR Code เพื่อร่วมลอยกระทง',
    types: {
      leaf: 'กระทงใบตอง',
      lotus: 'กระทงดอกบัว',
      bread: 'กระทงขนมปัง',
      coconut: 'กระทงกะลามะพร้าว'
    },
    nameMax: 30,
    wishMax: 120,
    wishRequired: false
  }
};

// ตรวจสอบโหมดจาก URL (?mode=display สำหรับเปิดขึ้นจอใหญ่/โปรเจกเตอร์)
(function(){
  var params = new URLSearchParams(window.location.search);
  var mode = params.get('mode') === 'display' ? 'display' : 'phone';
  var cleanUrl = window.location.origin + window.location.pathname;
  window.CFG = Object.assign({}, APP_CONFIG.FALLBACK_CFG, {
    mode: mode,
    appUrl: APP_CONFIG.FALLBACK_CFG.appUrl || cleanUrl
  });
})();
</script>
<style>
:root{
  --accent:#f4c565;--accent-hi:#fff0c4;--accent-lo:#d9963a;
  --ink:#f3f1ff;--muted:#bcc0e6;--dim:#8f94c2;
  --glass:rgba(11,15,48,.84);--glass-b:rgba(255,255,255,.14);
  --font:'Prompt','Noto Sans Thai','Sarabun','Leelawadee UI','Thonburi',system-ui,sans-serif;
  --head:'Mitr','Prompt','Noto Sans Thai',sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050a22;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:
  radial-gradient(130% 95% at 50% 45%,transparent 58%,rgba(2,4,18,.55) 100%),
  linear-gradient(to bottom,rgba(3,6,24,.38),transparent 22%)}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:0 24px 70px rgba(2,3,18,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.grad-text{background:linear-gradient(180deg,var(--accent-hi) 8%,var(--accent) 56%,var(--accent-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:999px;font-size:16px;font-weight:500;
  transition:transform .25s var(--ease),box-shadow .25s,opacity .25s,border-color .25s}
.btn:active{transform:scale(.97)}
.btn.gold{color:#2b1906;background:linear-gradient(135deg,var(--accent-hi),var(--accent) 50%,var(--accent-lo));box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.3) inset}
.btn.ghost{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.btn[disabled]{opacity:.55;pointer-events:none}
.flamei{width:13px;height:19px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 75%,#fff 0 18%,#ffd36a 42%,#ff8a1f 86%);
  box-shadow:0 0 12px 3px rgba(255,170,60,.6);transform-origin:50% 100%;animation:flk 1.6s ease-in-out infinite alternate}
@keyframes flk{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(.94,1.08) skewX(2deg)}60%{transform:scale(1.04,.95) skewX(-2deg)}100%{transform:scale(.98,1.04) skewX(1deg)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* bubble (ข้อความเหนือกระทง) */
#bubble{position:fixed;left:0;top:0;z-index:12;width:min(300px,80vw);padding:10px 16px 12px;border-radius:16px;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;
  background:rgba(12,15,50,.9);border:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 8px 26px rgba(0,0,0,.4);will-change:transform}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);background:rgba(12,15,50,.95);border-right:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);border-bottom:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent)}
#bubble b{display:block;color:var(--accent);font-weight:500;font-size:16px;word-break:break-word}
#bubble span{display:block;margin-top:3px;font-size:15px;line-height:1.5;color:#fbf3df;font-weight:300;word-break:break-word}
#bubble:not(:has(span:not(:empty))) b{font-size:15px}
.snd{position:fixed;z-index:30;right:max(14px,env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:rgba(14,18,52,.55);border:1px solid var(--glass-b);color:var(--muted);}
.snd svg{width:20px;height:20px}
.snd.off{opacity:.6}
.snd.off .wave{display:none}
@media (prefers-reduced-motion:reduce){.flamei{animation:none}}

/* ---------- Hero ---------- */
.hero{position:fixed;left:50%;transform:translateX(-50%);top:clamp(54px,9vh,110px);width:min(760px,92vw);text-align:center;z-index:10;
  transition:opacity .8s var(--ease),transform .8s var(--ease)}
.hero>*{animation:rise 1.1s var(--ease) both}
.hero>*:nth-child(2){animation-delay:.1s}.hero>*:nth-child(3){animation-delay:.2s}.hero>*:nth-child(4){animation-delay:.3s}.hero>*:nth-child(5){animation-delay:.4s}.hero>*:nth-child(6){animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero::before{content:"";position:absolute;inset:-40px -60px -30px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(4,7,30,.55),rgba(4,7,30,.2) 62%,transparent)}
.logo{display:block;margin:0 auto 10px;max-height:64px;max-width:160px;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.org{display:inline-flex;align-items:center;gap:10px;color:var(--accent);font-size:clamp(14px,3.6vw,17px);letter-spacing:.6px;font-weight:500;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.org::before,.org::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.org::after{transform:scaleX(-1)}
.hero h1{font-family:var(--head);font-weight:500;font-size:clamp(34px,9.4vw,64px);line-height:1.5;margin:.12em 0 0;padding-top:.1em;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 32%,transparent))}
.sub{margin:6px auto 0;max-width:520px;font-size:clamp(14px,3.8vw,17px);line-height:1.75;color:#e6e7fb;font-weight:300;text-shadow:0 2px 12px rgba(4,6,28,.95)}
.cta{margin-top:20px;display:inline-flex;align-items:center;gap:12px;padding:17px 34px 17px 28px;border-radius:999px;font-size:18px;font-weight:500;color:#2b1906;
  background:linear-gradient(135deg,var(--accent-hi),var(--accent) 48%,var(--accent-lo));
  box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 12px 34px rgba(0,0,0,.3),0 0 60px color-mix(in srgb,var(--accent) 28%,transparent);
  transition:transform .35s var(--ease);animation:rise 1.1s var(--ease) .5s both,pulse 3.2s ease-in-out 1.6s infinite alternate}
.cta:hover{transform:translateY(-2px) scale(1.02)}.cta:active{transform:scale(.98)}
@keyframes pulse{0%{box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 12px 34px rgba(0,0,0,.3),0 0 36px color-mix(in srgb,var(--accent) 16%,transparent)}100%{box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 14px 40px rgba(0,0,0,.3),0 0 70px color-mix(in srgb,var(--accent) 38%,transparent)}}
.closedmsg{margin-top:18px;padding:14px 20px;border-radius:18px;font-size:16px;line-height:1.7;color:#ffe9c4}
body.floating .hero,body.sheet-open .hero{opacity:0;transform:translate(-50%,-12px);pointer-events:none}
.counter{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;padding:8px 16px;border-radius:999px;font-size:clamp(12.5px,3.4vw,14px);color:var(--muted);white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.counter b{color:var(--accent-hi);font-weight:600;font-size:clamp(14px,3.8vw,16px);margin:0 3px}
.counter .sep{margin:0 8px;opacity:.45}
.foot{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:8;text-align:center;font-size:clamp(11px,3vw,12px);color:rgba(210,214,245,.6);padding:0 20px;pointer-events:none}
body.sheet-open .counter,body.sheet-open .foot,body.floating .foot{opacity:0}

/* ---------- Sheet ---------- */
.sheetwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .4s var(--ease),visibility 0s .4s}
.sheetwrap.open{visibility:visible;opacity:1;transition:opacity .4s var(--ease)}
.backdrop{position:absolute;inset:0;background:rgba(3,5,22,.62)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;border-radius:28px 28px 0 0;padding:22px 22px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(40px);transition:transform .5s var(--ease)}
.sheetwrap.open .sheet{transform:none}
@media (min-width:640px){.sheetwrap{align-items:center}.sheet{border-radius:28px;max-height:min(760px,calc(100dvh - 40px))}}
.sheet h2{font-family:var(--head);font-weight:500;font-size:22px;margin-bottom:14px;padding-right:44px}
.close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.close svg{width:18px;height:18px}
.steps{list-style:none;display:flex;gap:6px;margin-bottom:16px}
.steps li{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 6px;border-radius:14px;font-size:13px;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);transition:.3s}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.22);flex:none}
.steps li.active{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.steps li.active .n{background:var(--accent);color:#2b1906;border-color:var(--accent)}
.steps li.done .n{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent-hi)}
.body{flex:1;min-height:0;overflow:auto;padding:2px 2px 6px}
.pane{animation:paneIn .4s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.lbl{font-size:14px;color:var(--muted);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 8px 12px;border-radius:20px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s,background .3s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.card canvas{width:100%;max-width:150px;aspect-ratio:232/196;display:block;pointer-events:none}
.card b{font-size:15px;font-weight:500;margin-top:2px}
.card small{font-size:12px;line-height:1.45;color:var(--muted);margin-top:2px;font-weight:300;padding:0 4px}
.card .tick{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#2b1906;transform:scale(0);transition:transform .3s var(--ease)}
.card .tick svg{width:14px;height:14px}
.card.sel{border-color:var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,transparent),color-mix(in srgb,var(--accent) 3%,transparent));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 70%,transparent),0 0 30px color-mix(in srgb,var(--accent) 25%,transparent)}
.card.sel .tick{transform:scale(1)}.card.sel b{color:var(--accent-hi)}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
.inp{width:100%;min-height:56px;padding:14px 18px;border-radius:16px;font-size:17px;background:rgba(5,8,32,.6);border:1px solid rgba(255,255,255,.16);outline:none;transition:border-color .25s,box-shadow .25s;resize:none;font-family:var(--font)}
.inp::placeholder{color:#7f84b3}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.inp.bad{border-color:rgba(255,150,130,.8)}
textarea.inp{min-height:130px;line-height:1.7}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--dim);margin-top:8px;min-height:20px}
.err{color:#ffb4a8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);transition:.2s}
.chip:hover{color:var(--accent-hi);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.sum{margin-top:12px;font-size:13.5px;color:var(--muted)}.sum b{color:var(--accent-hi);font-weight:500}
.foot2{display:flex;gap:10px;margin-top:14px}
.foot2 .grow{flex:1}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.spin{display:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(43,25,6,.3);border-top-color:#2b1906;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Loader / Thanks / Toast ---------- */
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,5,22,.55);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s;pointer-events:none}
.loader.show{opacity:1;visibility:visible;transition:opacity .3s;pointer-events:auto}
.loader div{text-align:center;color:var(--accent-hi)}
.loader .flamei{width:22px;height:32px;margin:0 auto 14px}
.toast{position:fixed;z-index:60;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translate(-50%,-10px);max-width:calc(100vw - 32px);padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;visibility:hidden;transition:.35s var(--ease);text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media (max-width:520px){.hero{top:max(50px,7vh)}.steps li{font-size:12px}.steps .n{display:none}}
@media (max-height:640px){.hero h1{font-size:30px}.sub{display:none}.cta{margin-top:12px}}

/* ---------- Display Mode ---------- */
body{cursor:default}body.idle{cursor:none}
.dtitle{position:fixed;top:clamp(16px,3.4vh,44px);left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none;width:92vw}
.dtitle .org{display:inline-flex;align-items:center;gap:14px;color:var(--accent);font-size:clamp(14px,1.25vw,26px);letter-spacing:1.6px;font-weight:500;text-shadow:0 2px 14px rgba(0,0,0,.75)}
.dtitle .org::before,.dtitle .org::after{content:"";width:clamp(26px,3vw,64px);height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.dtitle .org::after{transform:scaleX(-1)}
.dtitle h1{font-family:var(--head);font-weight:500;font-size:clamp(32px,4vw,84px);line-height:1.5;margin-top:.04em;padding-top:.08em;filter:drop-shadow(0 3px 18px rgba(0,0,0,.55))}
.dtitle .logo{display:block;margin:0 auto 6px;max-height:clamp(40px,6.5vh,96px);max-width:22vw;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.dtitle::before{content:"";position:absolute;inset:-30px -10% -30px;z-index:-1;background:radial-gradient(closest-side,rgba(3,6,28,.55),transparent)}

.dqr{position:fixed;left:clamp(14px,1.8vw,40px);bottom:clamp(14px,2.4vh,40px);z-index:5;display:flex;align-items:center;gap:clamp(12px,1.2vw,26px);padding:clamp(12px,1.1vw,22px) clamp(16px,1.5vw,30px) clamp(12px,1.1vw,22px) clamp(12px,1.1vw,22px);border-radius:24px;max-width:35vw}
.dqr canvas{width:clamp(96px,9.4vw,190px);height:clamp(96px,9.4vw,190px);border-radius:12px;background:#fff;display:block;flex:none}
.dqr .t1{font-size:clamp(12px,.95vw,19px);color:var(--muted)}
.dqr .t2{font-size:clamp(16px,1.55vw,32px);color:var(--accent-hi);font-weight:500;line-height:1.35;margin-top:2px;word-break:break-word}
.dqr .t3{font-size:clamp(10px,.72vw,14px);color:var(--dim);margin-top:6px;word-break:break-all}
.dqr .flamei{display:inline-block;vertical-align:-2px;margin-right:8px;width:10px;height:15px}
.dcount{position:fixed;right:clamp(14px,1.8vw,40px);bottom:clamp(14px,2.4vh,40px);z-index:5;border-radius:24px;padding:clamp(10px,1vw,20px) clamp(16px,1.6vw,34px);text-align:right}
.dcount .dnums{display:flex;align-items:baseline;justify-content:flex-end;gap:clamp(10px,1.2vw,22px)}
.dcount .dsep{width:1px;height:clamp(22px,2.4vw,44px);background:rgba(255,255,255,.16);align-self:center}
.dcount .l{font-size:clamp(12px,.95vw,19px);color:var(--muted)}
.dcount b{font-size:clamp(26px,2.9vw,64px);color:var(--accent-hi);font-weight:600;line-height:1.15;margin:0 6px;font-variant-numeric:tabular-nums}
.dcount .u{font-size:clamp(12px,.95vw,19px);color:var(--muted)}
.dstat{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:clamp(10px,.72vw,13px);color:var(--dim);margin-top:4px}
.dstat i{width:8px;height:8px;border-radius:50%;background:#9aa0c8}.dstat.ok i{background:#5fe08a;box-shadow:0 0 8px #5fe08a}.dstat.err i{background:#ff8a6a}
.banner{position:fixed;left:50%;bottom:clamp(14px,2.4vh,40px);z-index:6;transform:translate(-50%,30px);width:min(27vw,560px);min-width:300px;padding:clamp(12px,1.1vw,22px) clamp(18px,1.6vw,34px);border-radius:26px;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .6s var(--ease),transform .6s var(--ease),visibility 0s .6s}
.banner.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.banner .e{font-size:clamp(11px,.85vw,16px);letter-spacing:1.4px;color:var(--accent)}
.banner .n{font-family:var(--head);font-weight:500;font-size:clamp(24px,2.3vw,50px);line-height:1.4;margin-top:2px;word-break:break-word}
.banner .w{font-size:clamp(16px,1.5vw,32px);line-height:1.6;color:#fff1cf;margin-top:4px;word-break:break-word;font-weight:300}
.bar{position:fixed;top:12px;right:12px;z-index:30;display:flex;gap:8px;opacity:0;transition:opacity .4s}
body:not(.idle) .bar{opacity:1}
.bar .snd{position:static}
.fs{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(14,18,52,.55);border:1px solid var(--glass-b);color:var(--muted)}
.fs svg{width:20px;height:20px}
.warn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;padding:22px 30px;border-radius:22px;text-align:center;font-size:18px;line-height:1.7;max-width:80vw}
@media (max-width:900px){.dqr{max-width:60vw}.banner{width:min(90vw,520px)}.dqr .t3{display:none}}

<script>
/* =====================================================================
   LoyScene — ฉากสายน้ำ + กระทง (วาดด้วย Canvas ทั้งหมด)
   ===================================================================== */
(function(){
'use strict';
var TAU=Math.PI*2, FONT="'Prompt','Noto Sans Thai','Sarabun','Leelawadee UI',sans-serif";
var TYPE_LIST=['leaf','lotus','bread','coconut'];
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}

var _hc={};
function hex(h){if(_hc[h])return _hc[h];var s=String(h).replace('#','');if(s.length===3)s=s.split('').map(function(c){return c+c;}).join('');var n=parseInt(s,16)||0;return(_hc[h]=[n>>16&255,n>>8&255,n&255]);}
function rgb(c,a){return a==null?'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
function mixc(a,b,t){a=typeof a==='string'?hex(a):a;b=typeof b==='string'?hex(b):b;return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function mx(a,b,t){return rgb(mixc(a,b,t));}

var SPR={w:270,h:240,ox:135,oy:186,k:2};
var ANCHOR={};
var _spr={};

function ell(g,x,y,rx,ry,fill,stroke,lw){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}}
function lgr(g,x0,y0,x1,y1,st){var q=g.createLinearGradient(x0,y0,x1,y1);for(var i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}
function rgr(g,x,y,r0,r1,st){var q=g.createRadialGradient(x,y,r0,x,y,r1);for(var i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}

function petal(g,bx,by,tx,ty,w,pal,o){
  o=o||{};
  var k=o.round?.5:.14, hh=by-ty;
  var L=[bx-w*.58+(tx-bx)*.2,by-hh*.42,tx-w*k,ty+hh*.14];
  var R=[tx+w*k,ty+hh*.14,bx+w*.58+(tx-bx)*.2,by-hh*.42];
  g.beginPath();g.moveTo(bx-w/2,by);g.bezierCurveTo(L[0],L[1],L[2],L[3],tx,ty);g.lineTo(bx,by);g.closePath();
  g.fillStyle=lgr(g,bx,by,tx,ty,[[0,pal.a0],[1,pal.a1]]);g.fill();
  g.beginPath();g.moveTo(tx,ty);g.bezierCurveTo(R[0],R[1],R[2],R[3],bx+w/2,by);g.lineTo(bx,by);g.closePath();
  g.fillStyle=lgr(g,bx,by,tx,ty,[[0,pal.b0],[1,pal.b1]]);g.fill();
  g.beginPath();g.moveTo(bx-w/2,by);g.bezierCurveTo(L[0],L[1],L[2],L[3],tx,ty);g.bezierCurveTo(R[0],R[1],R[2],R[3],bx+w/2,by);
  g.strokeStyle=o.edge||'rgba(0,25,10,.28)';g.lineWidth=.9;g.stroke();
  if(o.vein){g.beginPath();g.moveTo(bx,by-1);g.lineTo(tx,ty+2);g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=.8;g.stroke();}
}
function pal(base,tip,fold,lit){
  lit=lit||0;
  var b=mixc(base,'#ffffff',Math.max(0,lit)*.22),t=mixc(tip,'#ffffff',Math.max(0,lit)*.22);
  return{a0:rgb(mixc(b,'#000',fold*.9)),a1:rgb(mixc(t,'#000',fold)),b0:rgb(mixc(b,'#fff',fold*.55)),b1:rgb(mixc(t,'#fff',fold*.55))};
}
function ring(g,cx,cy,rx,ry,o){
  var L=[],i,a,s;
  for(i=0;i<o.n;i++){a=(o.off||0)+TAU*i/o.n;s=Math.sin(a);
    if(o.side==='back'&&s>0)continue;if(o.side==='front'&&s<=0)continue;L.push({a:a,s:s,c:Math.cos(a),i:i});}
  L.sort(function(p,q){return p.s-q.s;});
  L.forEach(function(p){
    var bx=cx+rx*p.c,by=cy+ry*p.s,hh=o.h*(1+(((p.i*7)%5)-2)*.03);
    var tx=bx+p.c*(o.lean||0),ty=by-hh+p.s*(o.drop||0);
    petal(g,bx,by,tx,ty,o.w*(1+(((p.i*3)%4)-1.5)*.03),o.pal(p),o);
  });
}
function marigold(g,x,y,r){
  var i,a;ell(g,x,y+r*.12,r*1.02,r*.78,'rgba(90,40,0,.35)');
  for(i=0;i<10;i++){a=TAU*i/10+.2;ell(g,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.46,r*.38,r*.3,i%2?'#f08a10':'#f79f1a','rgba(120,50,0,.35)',.6);}
  for(i=0;i<7;i++){a=TAU*i/7;ell(g,x+Math.cos(a)*r*.34,y+Math.sin(a)*r*.26,r*.3,r*.24,'#ffbb2d');}
  ell(g,x,y,r*.26,r*.2,'#ffe37c');
}
function blossom(g,x,y,r,c1,c2,cc){
  var i,a;for(i=0;i<5;i++){a=TAU*i/5-Math.PI/2;
    g.save();g.translate(x+Math.cos(a)*r*.5,y+Math.sin(a)*r*.38);
    ell(g,0,0,r*.5,r*.42,lgr(g,-r*.4,-r*.3,r*.4,r*.3,[[0,c1],[1,c2]]),'rgba(60,0,40,.25)',.6);g.restore();}
  ell(g,x,y,r*.22,r*.17,cc||'#ffe27a');
}
function candle(g,x,by,h,w){
  var top=by-h,ry=w*.42;
  g.beginPath();g.moveTo(x-w,top);g.lineTo(x-w,by);g.ellipse(x,by,w,ry,0,Math.PI,0,true);g.lineTo(x+w,top);g.closePath();
  g.fillStyle=lgr(g,x-w,0,x+w,0,[[0,'#cfbd93'],[.45,'#fffaf0'],[1,'#c2ab80']]);g.fill();
  ell(g,x,top,w,ry,'#fff7df','rgba(160,130,80,.5)',.6);
  g.beginPath();g.moveTo(x+w*.35,top+1);g.quadraticCurveTo(x+w*.75,top+7,x+w*.5,top+13);g.strokeStyle='rgba(255,246,220,.9)';g.lineWidth=2;g.lineCap='round';g.stroke();
  g.beginPath();g.moveTo(x,top);g.lineTo(x+.4,top-5);g.strokeStyle='#33200f';g.lineWidth=1.5;g.stroke();
  return top-5;
}
function incense(g,bx,by,tx,ty){
  g.beginPath();g.moveTo(bx,by);g.lineTo(tx,ty);g.strokeStyle='#6d3f1f';g.lineWidth=2.4;g.lineCap='round';g.stroke();
  g.beginPath();g.moveTo(bx,by);g.lineTo(tx,ty);g.strokeStyle='rgba(255,210,150,.35)';g.lineWidth=.8;g.stroke();
  g.fillStyle=rgr(g,tx,ty,0,6,[[0,'rgba(255,120,40,1)'],[1,'rgba(255,80,10,0)']]);g.fillRect(tx-6,ty-6,12,12);
  ell(g,tx,ty,1.6,1.6,'#ff6a2a');
}
function incenseSet(g,x,y,spread,top){
  incense(g,x-5,y,x-spread,top+4);incense(g,x+5,y,x+spread,top+4);incense(g,x,y,x+2,top-8);
}
function wallCyl(g,rx,ry,cy,th,stops){
  g.beginPath();g.moveTo(-rx,cy);g.lineTo(-rx,cy+th);g.ellipse(0,cy+th,rx,ry,0,Math.PI,0,true);g.lineTo(rx,cy);g.closePath();
  g.fillStyle=lgr(g,-rx,0,rx,0,stops);g.fill();
}

var ART={
leaf:function(g){
  var cy=-22,rx=82,ry=25,th=20;
  wallCyl(g,rx,ry,cy,th,[[0,'#bfae74'],[.38,'#f7f0cc'],[.72,'#d8c98f'],[1,'#a89658']]);
  ell(g,0,cy,rx,ry,rgr(g,-12,cy-4,4,rx,[[0,'#fffbe6'],[1,'#d9cb92']]),'rgba(120,100,40,.4)',.8);
  ring(g,0,cy,rx*.9,ry*.9,{n:14,h:66,w:36,lean:7,side:'back',vein:1,pal:function(p){return pal('#276f35','#9bd57f',.28,-p.c);}});
  ring(g,0,cy,rx*.55,ry*.55,{n:9,off:.3,h:54,w:30,lean:4,side:'back',vein:1,pal:function(p){return pal('#2f7f3b','#b4e08e',.25,-p.c);}});
  [[-30,-38],[30,-38],[-12,-44],[14,-44]].forEach(function(p){marigold(g,p[0],p[1],11);});
  incenseSet(g,0,-40,16,-122);
  var ft=candle(g,0,-30,44,5.5);
  ring(g,0,cy,rx*.9,ry*.9,{n:14,h:62,w:36,lean:9,side:'front',vein:1,pal:function(p){return pal('#2b7a3a','#a6dd88',.3,-p.c);}});
  [[-56,-6],[-24,2],[18,3],[52,-4],[0,-2]].forEach(function(p,i){marigold(g,p[0],p[1],i%2?12:14);});
  return{x:0,y:ft};
},
lotus:function(g){
  var cy=-14;
  ell(g,0,-3,104,32,rgr(g,0,-3,6,104,[[0,'#4f9a48'],[.8,'#2c6b36'],[1,'#1d4d29']]),'rgba(0,40,10,.5)',1);
  for(var i=0;i<14;i++){var a=TAU*i/14;g.beginPath();g.moveTo(0,-3);g.lineTo(Math.cos(a)*100,-3+Math.sin(a)*30);g.strokeStyle='rgba(180,230,150,.16)';g.lineWidth=1;g.stroke();}
  ring(g,0,cy,52,15,{n:9,h:74,w:50,lean:20,round:1,side:'back',pal:function(p){return pal('#fde4ee','#ee7aa4',.1,-p.c);}});
  ring(g,0,cy,32,9,{n:7,off:.4,h:62,w:40,lean:9,round:1,side:'back',pal:function(p){return pal('#ffeef4','#f08fb4',.08,-p.c);}});
  ell(g,0,-26,17,6,rgr(g,0,-26,1,17,[[0,'#ffe27a'],[1,'#d99b22']]),'rgba(120,70,0,.4)',.7);
  for(var j=0;j<9;j++)ell(g,Math.cos(j*2.1)*9,-26+Math.sin(j*2.1)*2.4,1.1,.8,'#7a4a00');
  incenseSet(g,0,-36,16,-124);
  var ft=candle(g,0,-28,46,5.5);
  ring(g,0,cy,32,9,{n:7,off:.1,h:58,w:40,lean:8,round:1,side:'front',pal:function(p){return pal('#fff0f5','#f49ab9',.08,-p.c);}});
  ring(g,0,cy,52,15,{n:9,h:68,w:50,lean:24,round:1,side:'front',pal:function(p){return pal('#fff3f7','#f088ad',.1,-p.c);}});
  return{x:0,y:ft};
},
bread:function(g){
  var cy=-34,rx=80,ry=25,th=30;
  wallCyl(g,rx,ry,cy,th,[[0,'#8e5522'],[.35,'#e3a55a'],[.7,'#c98238'],[1,'#7e481b']]);
  for(var i=0;i<26;i++){var a=rnd(0,Math.PI),x=Math.cos(a)*rx*rnd(.2,.95),y=cy+th*rnd(.2,.9)+Math.sin(a)*ry*.8;ell(g,x,y,rnd(.8,1.8),rnd(.6,1.2),'rgba(255,225,160,.35)');}
  ell(g,0,cy,rx,ry,rgr(g,-14,cy-5,4,rx,[[0,'#fbe0a4'],[.7,'#e0a55a'],[1,'#b9772f']]),'rgba(110,60,10,.45)',1);
  ell(g,0,cy,rx*.82,ry*.78,'rgba(150,90,30,.2)');
  ring(g,0,cy,rx*.86,ry*.86,{n:15,h:32,w:24,lean:5,round:1,side:'back',pal:function(p){return pal('#5fa24f','#c7e59f',.2,-p.c);}});
  blossom(g,-34,cy-10,12,'#d58cf0','#a24fcf','#ffe27a');blossom(g,34,cy-10,12,'#ff9cc1','#e0558a','#ffe27a');
  incenseSet(g,0,cy-8,16,-124);
  var ft=candle(g,0,cy-4,46,5.5);
  ring(g,0,cy,rx*.86,ry*.86,{n:15,h:30,w:24,lean:7,round:1,side:'front',pal:function(p){return pal('#5fa24f','#d4eca9',.2,-p.c);}});
  blossom(g,-50,cy+4,13,'#d58cf0','#a24fcf','#ffe27a');blossom(g,-8,cy+11,14,'#ffb0cd','#e0558a','#ffe27a');blossom(g,40,cy+6,13,'#d58cf0','#a24fcf','#ffe27a');
  marigold(g,14,cy-12,9);
  return{x:0,y:ft};
},
coconut:function(g){
  var cy=-30,rx=66,ry=21;
  g.beginPath();g.moveTo(-rx,cy);g.bezierCurveTo(-rx-2,cy+34,-38,cy+46,0,cy+46);g.bezierCurveTo(38,cy+46,rx+2,cy+34,rx,cy);g.ellipse(0,cy,rx,ry,0,0,Math.PI);g.closePath();
  g.fillStyle=rgr(g,-18,cy+6,6,rx*1.3,[[0,'#9a6238'],[.55,'#5d361c'],[1,'#2e180b']]);g.fill();
  for(var i=0;i<46;i++){var x=rnd(-rx*.9,rx*.9),y=cy+rnd(8,40)*(1-Math.abs(x)/rx*.35);g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(-3,3),y+rnd(3,7));g.strokeStyle=Math.random()<.5?'rgba(255,220,170,.18)':'rgba(0,0,0,.25)';g.lineWidth=.8;g.stroke();}
  ell(g,0,cy,rx,ry,'#e0c898','rgba(60,30,10,.7)',2.2);
  ell(g,0,cy+1,rx-4,ry-3,rgr(g,0,cy,3,rx,[[0,'#7a4a28'],[1,'#3a2010']]));
  ring(g,0,cy,rx*.8,ry*.8,{n:11,h:72,w:24,lean:22,side:'back',vein:1,pal:function(p){return pal('#2a7536','#8fd274',.3,-p.c);}});
  ring(g,0,cy,rx*.45,ry*.45,{n:7,off:.5,h:52,w:20,lean:8,side:'back',vein:1,pal:function(p){return pal('#33853f','#a9e08c',.26,-p.c);}});
  incenseSet(g,0,cy-6,16,-122);
  var ft=candle(g,0,cy-2,44,5.5);
  ring(g,0,cy,rx*.8,ry*.8,{n:10,h:44,w:22,lean:16,side:'front',vein:1,pal:function(p){return pal('#2f7e3b','#9edb82',.3,-p.c);}});
  [[-42,cy+8],[-14,cy+14],[16,cy+13],[44,cy+7]].forEach(function(p){blossom(g,p[0],p[1],9,'#ffffff','#e7e7ef','#f5c52a');});
  marigold(g,-26,cy-2,9);marigold(g,28,cy-1,9);
  return{x:0,y:ft};
}};

function getSprite(type){
  if(_spr[type])return _spr[type];
  var c=mk(SPR.w*SPR.k,SPR.h*SPR.k),g=c.getContext('2d');
  g.scale(SPR.k,SPR.k);g.translate(SPR.ox,SPR.oy);
  ANCHOR[type]=ART[type](g);
  return(_spr[type]=c);
}

var _soft=null;
function softSprites(){
  if(_soft)return _soft;
  function soft(w,h,st){var c=mk(w,h),x=c.getContext('2d');x.translate(w/2,h/2);x.scale(1,h/w);x.fillStyle=rgr(x,0,0,0,w/2,st);x.beginPath();x.arc(0,0,w/2,0,TAU);x.fill();return c;}
  var streak=mk(64,96),sx=streak.getContext('2d');
  for(var j=0;j<6;j++){var yy=8+j*13,aa=.34*(1-j/6);sx.fillStyle='rgba(255,176,90,'+aa+')';sx.beginPath();sx.ellipse(32,yy,15-j*1.8,2.6,0,0,TAU);sx.fill();}
  _soft={
    shadow:soft(256,72,[[0,'rgba(2,6,22,.5)'],[1,'rgba(2,6,22,0)']]),
    light:soft(256,72,[[0,'rgba(255,170,80,.42)'],[1,'rgba(255,140,50,0)']]),
    glow:soft(128,128,[[0,'rgba(255,190,90,.55)'],[.4,'rgba(255,150,50,.2)'],[1,'rgba(255,120,40,0)']]),
    streak:streak
  };
  return _soft;
}

function drawFlame(g,t,s,glowK){
  var f1=Math.sin(t*9+s*7)*.5+Math.sin(t*14.3+s*3)*.5,f2=Math.sin(t*6.1+s*5);
  var sx=1+f1*.05,sy=1+f2*.08,sk=f1*.12;
  var gk=(glowK==null?1:glowK)*(.86+f2*.1);
  g.save();g.globalCompositeOperation='lighter';g.globalAlpha=Math.min(1,gk);
  g.drawImage(softSprites().glow,-52,-66,104,104);
  g.restore();
  g.save();g.transform(sx,0,sk,sy,0,0);
  g.beginPath();g.moveTo(0,0);g.bezierCurveTo(-8,-1,-10,-9,-6.5,-17);g.bezierCurveTo(-4,-22,-1.4,-27,0,-35);g.bezierCurveTo(1.7,-27,4.8,-22.4,6.8,-17);g.bezierCurveTo(10,-9,8,-1,0,0);
  g.fillStyle=lgr(g,0,0,0,-35,[[0,'#ff6a12'],[.45,'#ffa72e'],[1,'rgba(255,224,138,.92)']]);g.fill();
  g.beginPath();g.moveTo(0,-1);g.bezierCurveTo(-4.4,-2,-5.8,-7.8,-3.6,-12.6);g.bezierCurveTo(-2,-16,-.6,-19,0,-24);g.bezierCurveTo(1.3,-19.4,3.2,-16.4,4,-12.6);g.bezierCurveTo(5.8,-7.8,4.4,-2,0,-1);
  g.fillStyle='#fff6d0';g.fill();
  ell(g,0,-3.5,2.4,3.2,'rgba(150,190,255,.55)');
  g.restore();
}

function drawKrathong(g,type,t,seed,opt){
  opt=opt||{};
  var spr=getSprite(type),an=ANCHOR[type],gk=.86+Math.sin(t*6.1+seed*5)*.1,SS=softSprites();
  if(!opt.noWater){
    g.drawImage(SS.shadow,-100,-18,200,52);
    for(var i=0;i<2;i++){var u=((t*.42+seed+i*.5)%1),rx=84+u*46;g.beginPath();g.ellipse(0,8,rx,rx*.27,0,0,TAU);g.strokeStyle='rgba(205,228,255,'+(.3*(1-u))+')';g.lineWidth=1.6;g.stroke();}
    g.save();g.globalCompositeOperation='lighter';g.globalAlpha=gk;
    g.drawImage(SS.light,-118,-21,236,66);
    g.drawImage(SS.streak,-32+Math.sin(t*2.2+seed*9)*3,20,64,96);
    g.restore();
  }
  g.drawImage(spr,-SPR.ox,-SPR.oy,SPR.w,SPR.h);
  g.save();g.translate(an.x,an.y);drawFlame(g,t,seed,gk);g.restore();
}

function preview(cv,type,t){
  var r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.round((r.width||cv.clientWidth||160)*dpr),h=Math.round((r.height||cv.clientHeight||140)*dpr);
  if(!w||!h)return;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  var g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,w,h);
  var S=Math.min(w/232,h/196);
  g.translate(w/2,h*.86+Math.sin(t*1.4)*1.5*dpr);g.scale(S,S);
  drawKrathong(g,type,t,.37,{noWater:true});
}

    g.setTransform(dpr,0,0,dpr,0,0);
    drawSky();drawWater();updateKrathongs();drawKrathongs();
    g.fillStyle=lgr(g,0,H*.82,0,H,[[0,'rgba(2,5,22,0)'],[1,'rgba(2,5,22,.35)']]);g.fillRect(0,H*.82,W,H*.18);
  }
  document.addEventListener('visibilitychange',function(){if(document.hidden){running=false;}else if(!running){running=true;last=0;requestAnimationFrame(frame);}});

  function hit(x,y){
    var best=null,bd=1e9;
    krs.forEach(function(k){var S=k.S*k.sc;if(Math.abs(x-k.sx)<(mode==='display'?100:90)*S&&y>k.sy-185*S&&y<k.sy+40*S){var d=Math.abs(x-k.sx);if(d<bd){bd=d;best=k;}}});
    return best;
  }
  cv.addEventListener('pointerdown',function(e){var k=hit(e.clientX,e.clientY);if(k){emit('tap',k);}else hideBubble();});
  window.addEventListener('resize',function(){clearTimeout(resize._t);resize._t=setTimeout(resize,150);});

  function relabel(){krs.forEach(function(k){if(k.name)k.label=makeLabel(k.name,k.wish);});}
  try{if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',relabel);}catch(e){}
  resize();requestAnimationFrame(frame);

  function updateConfig(newCfg){
    cfg=newCfg;
    dir=cfg.flow==='left'?-1:1;
    water=hex(cfg.waterColor);
    acc=hex(cfg.accent);
    maxK=cfg.maxOnScreen||36;
    resize();
    relabel();
  }

  return{on:on,add:addKrathong,remove:remove,list:function(){return krs;},count:function(){return krs.length;},
    showBubble:showBubble,hideBubble:hideBubble,size:function(){return{W:W,H:H,hy:hy,dir:dir};},pickLane:pickLane,time:function(){return T;},splash:splash,updateConfig:updateConfig};
}

   Shared Helpers (เชื่อมต่อ Google Apps Script API จาก GitHub Pages)
   ===================================================================== */
function applyTheme(cfg){
  var r=document.documentElement.style;
  r.setProperty('--accent',cfg.accent);
  r.setProperty('--accent-hi',mx(cfg.accent,'#ffffff',.62));
  r.setProperty('--accent-lo',mx(cfg.accent,'#5a2a00',.28));
}

function server(fn,arg,timeoutMs){
  var apiUrl=APP_CONFIG.GAS_API_URL;
  if(!apiUrl||apiUrl.indexOf('YOUR_SCRIPT_ID')>=0){
    return Promise.reject(new Error('กรุณาตั้งค่า GAS_API_URL ในไฟล์ index.html'));
  }
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},timeoutMs||20000);

  if(fn==='submitKrathong'){
    var payload=Object.assign({action:'submitKrathong'},arg||{});
    return fetch(apiUrl,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload),
      signal:ctrl.signal
    }).then(function(r){clearTimeout(timer);return r.json();})
      .catch(function(e){clearTimeout(timer);throw e;});
  }else{
    var url=apiUrl+'?action='+encodeURIComponent(fn)+(arg!=null?'&v='+encodeURIComponent(arg):'');
    return fetch(url,{method:'GET',signal:ctrl.signal})
      .then(function(r){clearTimeout(timer);return r.json();})
      .catch(function(e){clearTimeout(timer);throw e;});
  }
}

function music(cfg,btn){
  var a=null,on=false,curSrc='';
  function initAudio(src){
    if(!src||!btn)return;
    if(curSrc===src&&a)return;
    curSrc=src;
    if(a){a.pause();}
    a=new Audio(src);a.loop=true;a.volume=.55;
    btn.hidden=false;
    btn.classList.add('off');
  }
  function set(v){
    if(!a)return;
    on=v;
    btn.classList.toggle('off',!on);
    btn.setAttribute('aria-pressed',String(on));
    if(on){var p=a.play();if(p&&p.catch)p.catch(function(){on=false;btn.classList.add('off');});}
    else a.pause();
  }
  if(btn){
    btn.addEventListener('click',function(){btn._manual=true;set(!on);});
  }
  if(cfg.music)initAudio(cfg.music);
  return{
    start:function(){if(a&&!on&&!btn._manual){set(true);}},
    update:function(newSrc){if(newSrc)initAudio(newSrc);}
  };
}
window.Loy={Scene:LoyScene,preview:preview,applyTheme:applyTheme,server:server,music:music,TYPES:TYPE_LIST,mx:mx};
})();

          <div class="field"><label for="inpName">ชื่อ หรือ ชื่อเล่น ที่ต้องการให้แสดงบนกระทง</label>
            <input class="inp" id="inpName" type="text" placeholder="กรอกชื่อของคุณ" autocomplete="nickname" enterkeyhint="next"></div>
          <div class="meta"><span class="err" id="err2" role="alert"></span><span id="nameCount"></span></div>
          <p class="sum">กระทงที่เลือก: <b id="sumType">-</b></p>
        </div>
        <div class="pane" data-p="3" hidden>
          <div class="field"><label for="inpWish">คำอธิษฐาน <span id="optTag">(ไม่บังคับ)</span></label>
            <textarea class="inp" id="inpWish" placeholder="ขอให้…"></textarea></div>
          <div class="meta"><span class="err" id="err3" role="alert"></span><span id="wishCount"></span></div>
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <div class="foot2">
        <button class="btn ghost" id="btnBack" type="button">ย้อนกลับ</button>
        <span class="grow"></span>
        <button class="btn gold" id="btnNext" type="button">ถัดไป</button>
        <button class="btn gold" id="btnLaunch" type="button" hidden><span class="spin"></span><span>ลอยกระทง</span></button>
      </div>
    </section>
  </div>

  <div class="loader" id="loader" role="status" aria-live="polite"><div><div class="flamei"></div><p>กำลังนำกระทงลงสู่สายน้ำ…</p></div></div>
  <div class="toast glass" id="toast" role="status"></div>
</div>

<!-- ==================== โหมดจอแสดงผล (?mode=display) ==================== -->
<div id="dispUI">
  <header class="dtitle">
    <img class="logo" id="logo" alt="" hidden>
    <p class="org" id="orgName"></p>
    <h1 class="grad-text" id="title"></h1>
  </header>

  <aside class="dqr glass" id="qrBox" hidden>
    <canvas id="qr" aria-label="QR code สำหรับร่วมลอยกระทง"></canvas>
    <div><p class="t1"><span class="flamei"></span>ร่วมลอยกระทงด้วยมือถือ</p><p class="t2" id="qrNote"></p><p class="t3" id="qrUrl"></p></div>
  </aside>
  <aside class="dcount glass">
    <div class="dnums">
      <div><span class="l">ลอยแล้ว</span><b id="count">0</b><span class="u">ใบ</span></div>
      <div class="dsep"></div>
      <div><span class="l">ผู้ลอย</span><b id="dispFloaters">0</b><span class="u">คน</span></div>
    </div>
    <p class="dstat" id="stat"><i></i><span>กำลังเชื่อมต่อ…</span></p>
  </aside>
  <aside class="banner glass" id="banner" aria-live="polite"><p class="e">กระทงใบใหม่ลอยแล้ว</p><p class="n grad-text" id="bnName"></p><p class="w" id="bnWish"></p></aside>
  <div class="warn glass" id="warn" hidden></div>
  <div class="bar">
    <button class="snd" id="btnSound" type="button" aria-label="เปิด/ปิดเสียงเพลง" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg></button>
    <button class="fs" id="btnFs" type="button" aria-label="เต็มจอ (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>

<div id="bubble"><b></b><span></span></div>

<script>
document.getElementById(window.CFG.mode==='display'?'phoneUI':'dispUI').remove();

(function(){
var CFG=window.CFG;
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};

if(CFG.mode==='display'){
  /* =====================================================================
     DISPLAY MODE (จอใหญ่ / โปรเจกเตอร์ในงาน)
     ===================================================================== */
  Loy.applyTheme(CFG);
  document.title='จอแสดงผล · '+CFG.title+' · '+CFG.orgName;
  $('#orgName').textContent=CFG.orgName;$('#title').textContent=CFG.title;

  function drawQR(cv,text){
    var q=qrcode(0,'M');q.addData(text);q.make();
    var n=q.getModuleCount(),quiet=3,cells=n+quiet*2,px=Math.max(4,Math.ceil(512/cells)),size=cells*px;
    cv.width=cv.height=size;var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,size,size);g.fillStyle='#0a1033';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))g.fillRect((c+quiet)*px,(r+quiet)*px,px,px);
  }
  function refreshQR(){
    if(CFG.appUrl){
      try{drawQR($('#qr'),CFG.appUrl);$('#qrNote').textContent=CFG.qrNote;
        $('#qrUrl').textContent=CFG.appUrl.length>70?CFG.appUrl.slice(0,66)+'…':CFG.appUrl;$('#qrBox').hidden=false;}catch(e){}
    }
  }
  refreshQR();

  var scene=Loy.Scene($('#scene'),CFG,{mode:'display'});
  var snd=Loy.music(CFG,$('#btnSound'));
  var pool=[],seen={},onScreen={},since=0,total=0,floaters=0,fails=0,fresh=[],bannerBusy=false;
  var MAXK=CFG.maxOnScreen,AMB=CFG.ambient;

  function applyLiveConfig(newCfg){
    if(!newCfg)return;
    var cleanUrl=window.location.origin+window.location.pathname;
    CFG=Object.assign({},CFG,newCfg,{mode:'display',appUrl:newCfg.appUrl||cleanUrl});
    window.CFG=CFG;
    MAXK=CFG.maxOnScreen||36;AMB=CFG.ambient||10;
    Loy.applyTheme(CFG);
    document.title='จอแสดงผล · '+CFG.title+' · '+CFG.orgName;
    $('#orgName').textContent=CFG.orgName;$('#title').textContent=CFG.title;
    if(CFG.logo){var lg=$('#logo');lg.onerror=function(){lg.hidden=true;};lg.src=CFG.logo;lg.hidden=false;}
    else{$('#logo').hidden=true;}
    refreshQR();
    scene.updateConfig(CFG);
    snd.update(CFG.music);
  }

  function setStat(ok,txt){var s=$('#stat');s.className='dstat '+(ok?'ok':'err');s.querySelector('span').textContent=txt;}
  function setTotal(n,f){
    total=n;$('#count').textContent=n.toLocaleString('th-TH');
    if(f!=null)floaters=f;$('#dispFloaters').textContent=floaters.toLocaleString('th-TH');
  }
  function isNameWishVisible(e){
    if(!e||!e.name)return false;
    var list=scene.list();
    for(var i=0;i<list.length;i++){
      var k=list[i];
      if((e.id&&(k.origId===e.id||k.id===e.id))||(k.name===e.name&&(k.wish||'')===(e.wish||'')))return true;
    }
    return false;
  }
  function target(){return Math.min(MAXK,Math.max(AMB,pool.length));}
  function nextFromPool(){
    var wait={};fresh.forEach(function(f){wait[f.id]=1;});
    var c=pool.filter(function(e){return !onScreen[e.id]&&!wait[e.id]&&!isNameWishVisible(e);});
    if(!c.length)return null;
    // เลือกกระทงที่รอนานที่สุดก่อน เพื่อหมุนเวียนไม่ให้ชื่อเดิมซ้ำติดกัน
    c.sort(function(a,b){return (a._shownAt||0)-(b._shownAt||0);});
    var pickPool=c.slice(0,Math.min(3,c.length));
    var chosen=pickPool[(Math.random()*pickPool.length)|0];
    chosen._shownAt=Date.now();
    return chosen;
  }
  function spawn(e,opt){var k=scene.add(Object.assign({origId:e.id},e),opt||{});onScreen[k.id]=1;return k;}
  function fill(){
    if(scene.count()>=MAXK||scene.count()>=target())return;
    var e=nextFromPool(),off=Math.random()*.3,sx=CFG.flow==='left'?1+off:-off;
    if(e)spawn(e,{x:sx});
    else if(scene.count()<AMB)spawn({id:'a'+Math.random().toString(36).slice(2,8),type:Loy.TYPES[(Math.random()*4)|0]},{x:sx});
  }
  scene.on('exit',function(k){delete onScreen[k.id];if(k.origId)delete onScreen[k.origId];});
  scene.on('evict',function(k){delete onScreen[k.id];if(k.origId)delete onScreen[k.origId];});
  (function tick(){fill();setTimeout(tick,600+Math.random()*2000);})();

  function ingest(items,initial){
    items.forEach(function(e){
      if(!e.id||seen[e.id])return;seen[e.id]=1;
      e._shownAt=initial?0:Date.now();
      pool.push(e);if(e.ts>since)since=e.ts;
      if(!initial)fresh.push(e);
    });
    if(pool.length>400)pool.splice(0,pool.length-400);
    if(fresh.length>5)fresh=fresh.slice(-5);
  }

  function runBanner(){
    if(bannerBusy||!fresh.length||scene.count()>=MAXK)return;
    var e=fresh.shift();bannerBusy=true;
    // หากมีกระทงใบเดิมลอยอยู่ก่อนแล้ว ให้นำใบเก่าออกก่อนเพื่อไม่ให้ซ้ำกันในแม่น้ำ
    scene.list().slice().forEach(function(k){
      if((e.id&&(k.origId===e.id||k.id===e.id))||(e.name&&k.name===e.name&&(k.wish||'')===(e.wish||''))){
        scene.remove(k,true);delete onScreen[k.id];delete onScreen[k.origId];
      }
    });
    var fx=.12+Math.random()*.22;
    spawn(e,{drop:true,x:CFG.flow==='left'?1-fx:fx});
    $('#bnName').textContent=e.name;$('#bnWish').textContent=e.wish||'';$('#bnWish').hidden=!e.wish;
    $('#banner').classList.add('show');
    setTimeout(function(){$('#banner').classList.remove('show');setTimeout(function(){bannerBusy=false;runBanner();},700);},fresh.length>3?3800:6200);
  }
  setInterval(runBanner,900);
  scene.on('tap',function(k){scene.showBubble(k,6500);});

  function poll(){
    Loy.server('getSince',since,25000).then(function(r){
      fails=0;setStat(true,'เชื่อมต่อแล้ว');
      if(r&&r.ok){setTotal(r.total||total,r.floaters);ingest(r.items||[],false);}
    }).catch(function(){fails++;if(fails>=2)setStat(false,'เชื่อมต่อไม่ได้ กำลังลองใหม่…');})
    .then(function(){setTimeout(poll,(CFG.pollSeconds||5)*1000);});
  }

  Loy.server('init',null,25000).then(function(r){
    setStat(true,'เชื่อมต่อแล้ว');
    if(r&&r.ok){
      applyLiveConfig(r.cfg);
      setTotal(r.total||0,r.floaters||0);
      ingest(r.items||[],true);
      if(r.items&&r.items.length)since=Math.max(since,r.items[r.items.length-1].ts);
    }
  }).catch(function(err){
    setStat(false,err&&err.message?err.message:'เชื่อมต่อไม่ได้');
  }).then(function(){
    var n=Math.min(target(),pool.length?target():AMB),i,xs=[];
    for(i=0;i<n;i++)xs.push((i+Math.random()*.8)/n);
    xs.sort(function(){return Math.random()-.5;});
    for(i=0;i<n;i++){var e=nextFromPool();if(e)spawn(e,{x:xs[i]});else spawn({id:'a'+Math.random().toString(36).slice(2,8),type:Loy.TYPES[(Math.random()*4)|0]},{x:xs[i]});}
    setTimeout(poll,(CFG.pollSeconds||5)*1000);
  });

  function toggleFs(){var d=document,el=d.documentElement;try{if(!d.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);else(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(e){}snd.start();}
  $('#btnFs').addEventListener('click',toggleFs);
  document.addEventListener('keydown',function(e){if(e.key==='f'||e.key==='F')toggleFs();});
  var idleT;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle');},3500);}
  ['mousemove','pointerdown','keydown'].forEach(function(ev){window.addEventListener(ev,wake,{passive:true});});wake();
  try{if(navigator.wakeLock){var lock=function(){navigator.wakeLock.request('screen').catch(function(){});};lock();document.addEventListener('visibilitychange',function(){if(!document.hidden)lock();});}}catch(e){}

}else{
  /* =====================================================================
     PHONE / PARTICIPANT MODE (หน้าสำหรับผู้ร่วมงาน)
     ===================================================================== */
  var TYPE_INFO={
    leaf:{name:CFG.types.leaf,tag:'ใบตองพับกลีบ ประดับดาวเรือง แบบดั้งเดิม'},
    lotus:{name:CFG.types.lotus,tag:'กลีบบัวสีชมพูอ่อนหวาน งามสง่า'},
    bread:{name:CFG.types.bread,tag:'ย่อยสลายได้ เป็นอาหารให้ปลา'},
    coconut:{name:CFG.types.coconut,tag:'แข็งแรง ลอยสวย ใช้วัสดุธรรมชาติ'}
  };
  var CHIPS=['ขอให้ครอบครัวมีความสุข','ขอให้สุขภาพแข็งแรง','ขอให้การงานก้าวหน้า','ขอให้สมหวังดังตั้งใจ','ขอให้ความทุกข์ลอยไปกับสายน้ำ','ขอให้โชคดีตลอดปี'];
  var KEY_DEV='loy-dev',KEY_OUT='loy-outbox';

  function renderUI(){
    Loy.applyTheme(CFG);
    document.title=CFG.title+' · '+CFG.orgName;
    $('#orgName').textContent=CFG.orgName;
    $('#title').textContent=CFG.title;
    $('#subtitle').textContent=CFG.subtitle;$('#subtitle').hidden=!CFG.subtitle;
    $('#btnText').textContent=CFG.buttonText;
    if(CFG.footer)$('#foot').textContent=CFG.footer;
    if(CFG.logo){var lg=$('#logo');lg.onerror=function(){lg.hidden=true;};lg.src=CFG.logo;lg.hidden=false;}
    else{$('#logo').hidden=true;}
    if(!CFG.eventOpen){$('#btnStart').hidden=true;var cm=$('#closedMsg');cm.textContent=CFG.closedText;cm.hidden=false;}
    else{$('#btnStart').hidden=false;$('#closedMsg').hidden=true;}
    TYPE_INFO.leaf.name=CFG.types.leaf;
    TYPE_INFO.lotus.name=CFG.types.lotus;
    TYPE_INFO.bread.name=CFG.types.bread;
    TYPE_INFO.coconut.name=CFG.types.coconut;
    inpName.maxLength=CFG.nameMax;inpWish.maxLength=CFG.wishMax;
    $('#nameCount').textContent=inpName.value.length+'/'+CFG.nameMax;
    $('#wishCount').textContent=inpWish.value.length+'/'+CFG.wishMax;
    $('#optTag').textContent=CFG.wishRequired?'':'(ไม่บังคับ)';
  }

  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  var dev=lsGet(KEY_DEV);if(!dev){dev=Math.random().toString(36).slice(2,12)+Date.now().toString(36);lsSet(KEY_DEV,dev);}
  var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},3400);}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

  var scene=Loy.Scene($('#scene'),CFG,{mode:'phone'});
  var snd=Loy.music(CFG,$('#btnSound'));
  var recent=[],seenRecent={},total=0,floaters=0,sincePhone=0;
  function anon(){return{type:Loy.TYPES[(Math.random()*4)|0]};}

  // ตรวจสอบว่ากระทงใบนี้ (หรือชื่อ+คำอธิษฐานเดียวกัน) กำลังลอยอยู่ในแม่น้ำตอนนี้หรือไม่
  function isOnScreen(e){
    if(!e)return false;
    var list=scene.list();
    for(var i=0;i<list.length;i++){
      var k=list[i];
      if(e.id&&(k.origId===e.id||k.id===e.id))return true;
      if(e.name&&k.name===e.name&&(k.wish||'')===(e.wish||''))return true;
    }
    return false;
  }

  // เลือกกระทงถัดไปจากรายการที่ยังไม่ปรากฏในแม่น้ำ (หมุนเวียนตามลำดับเวลาที่แสดงล่าสุด)
  function pickNextRecent(){
    var avail=recent.filter(function(e){return !isOnScreen(e);});
    if(!avail.length)return null;
    avail.sort(function(a,b){return (a._shownAt||0)-(b._shownAt||0);});
    var chosen=avail[0];
    chosen._shownAt=Date.now();
    return chosen;
  }

  function spawnAmbient(atEdge){
    var e=pickNextRecent();
    if(e){
      scene.add({id:'r'+uid(),origId:e.id,type:e.type,name:e.name,wish:e.wish},atEdge?{}:{x:Math.random()*.9+.05});
    }else{
      var a=anon();
      scene.add({id:'a'+uid(),type:a.type},atEdge?{}:{x:Math.random()*.9+.05});
    }
  }
  var AMB=Math.min(CFG.ambient,innerWidth<420?5:8);
  for(var i=0;i<AMB;i++)spawnAmbient(false);
  scene.on('exit',function(k){if(!k.mine)spawnAmbient(true);});
  scene.on('tap',function(k){scene.showBubble(k,5200);});
  function setTotal(n,f){
    total=n;$('#total').textContent=n.toLocaleString('th-TH');
    if(f!=null)floaters=f;
    else if(n>0&&floaters===0)floaters=1;
    $('#floaters').textContent=floaters.toLocaleString('th-TH');
    $('#counter').hidden=false;
  }

  var st={step:1,type:null,busy:false,raf:0};
  var wrap=$('#sheetWrap'),inpName=$('#inpName'),inpWish=$('#inpWish');
  var tick='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

  function buildCards(){
    $('#cards').innerHTML=Loy.TYPES.map(function(t){
      var sel=st.type===t?' sel':'';
      return '<button class="card'+sel+'" type="button" role="radio" aria-checked="'+(st.type===t)+'" data-t="'+t+'"><span class="tick">'+tick+'</span><canvas></canvas><b>'+TYPE_INFO[t].name+'</b><small>'+TYPE_INFO[t].tag+'</small></button>';
    }).join('');
    $$('.card').forEach(function(c){c.addEventListener('click',function(){
      st.type=c.dataset.t;$$('.card').forEach(function(x){var on=x===c;x.classList.toggle('sel',on);x.setAttribute('aria-checked',String(on));});
      $('#sumType').textContent=TYPE_INFO[st.type].name;
      setTimeout(function(){if(st.step===1)goStep(2);},380);
    });});
  }

  renderUI();
  buildCards();
  $('#chips').innerHTML=CHIPS.map(function(c){return '<button class="chip" type="button">'+c+'</button>';}).join('');

  function mergeRecent(items){
    (items||[]).forEach(function(e){
      if(!e||!e.id||seenRecent[e.id])return;
      seenRecent[e.id]=1;
      e._shownAt=0;
      recent.push(e);
      if(e.ts>sincePhone)sincePhone=e.ts;
    });
    if(recent.length>60){
      var removed=recent.splice(0,recent.length-60);
      removed.forEach(function(x){delete seenRecent[x.id];});
    }
  }

  function pollPhone(){
    Loy.server('getSince',sincePhone,20000).then(function(r){
      if(r&&r.ok){
        setTotal(r.total||total,r.floaters);
        mergeRecent(r.items||[]);
      }
    }).catch(function(){})
    .then(function(){setTimeout(pollPhone,Math.max(8,(CFG.pollSeconds||5)*2)*1000);});
  }

  Loy.server('init',null,20000).then(function(r){
    if(!r||!r.ok)return;
    if(r.cfg){
      CFG=Object.assign({},CFG,r.cfg,{mode:'phone'});
      window.CFG=CFG;
      renderUI();
      buildCards();
      scene.updateConfig(CFG);
      snd.update(CFG.music);
    }
    mergeRecent(r.items||[]);
    setTotal(r.total||0,r.floaters||0);
    // ล้างกระทงจำลองเริ่มต้น แล้ววางกระทงจริงแบบไม่ซ้ำชื่อ
    scene.list().slice().forEach(function(k){if(!k.mine)scene.remove(k,true);});
    var xs=[];for(var j=0;j<AMB;j++)xs.push((j+Math.random()*.7)/AMB);
    xs.sort(function(){return Math.random()-.5;});
    for(var j=0;j<AMB;j++){
      var e=pickNextRecent();
      if(e)scene.add({id:'r'+uid(),origId:e.id,type:e.type,name:e.name,wish:e.wish},{x:xs[j]});
      else{var a=anon();scene.add({id:'a'+uid(),type:a.type},{x:xs[j]});}
    }
    setTimeout(pollPhone,Math.max(8,(CFG.pollSeconds||5)*2)*1000);
  }).catch(function(){});

  function animatePreviews(){
    if(!wrap.classList.contains('open')||st.step!==1){st.raf=0;return;}
    var t=performance.now()/1000;
    $$('.card').forEach(function(c){Loy.preview(c.querySelector('canvas'),c.dataset.t,t+(c.dataset.t.length));});
    st.raf=requestAnimationFrame(animatePreviews);
  }
  function goStep(n){
    st.step=n;
    $$('.pane').forEach(function(p){p.hidden=String(n)!==p.dataset.p;});
    $$('#steps li').forEach(function(li){var s=+li.dataset.s;li.classList.toggle('active',s===n);li.classList.toggle('done',s<n);});
    $('#btnBack').style.visibility=n===1?'hidden':'visible';
    $('#btnNext').hidden=n===3;$('#btnLaunch').hidden=n!==3;
    $('#sumType').textContent=st.type?TYPE_INFO[st.type].name:'-';
    if(n===1&&!st.raf)st.raf=requestAnimationFrame(animatePreviews);
    setTimeout(function(){try{if(n===2)inpName.focus({preventScroll:true});if(n===3)inpWish.focus({preventScroll:true});}catch(e){}},280);
  }
  function openSheet(n){
    document.body.classList.add('sheet-open');wrap.classList.add('open');wrap.setAttribute('aria-hidden','false');
    goStep(n||1);snd.start();
  }
  function closeSheet(){wrap.classList.remove('open');wrap.setAttribute('aria-hidden','true');document.body.classList.remove('sheet-open');}
  function bad(el,msg,errEl){errEl.textContent=msg;if(el){el.classList.add('bad','shake');setTimeout(function(){el.classList.remove('shake');},450);}return false;}
  function validate(n){
    $('#err2').textContent='';$('#err3').textContent='';inpName.classList.remove('bad');inpWish.classList.remove('bad');
    if(n===1&&!st.type){toast('กรุณาเลือกกระทง 1 แบบ');return false;}
    if(n===2&&!inpName.value.trim())return bad(inpName,'กรุณากรอกชื่อ',$('#err2'));
    if(n===3&&CFG.wishRequired&&!inpWish.value.trim())return bad(inpWish,'กรุณากรอกคำอธิษฐาน',$('#err3'));
    return true;
  }

  $('#btnNext').addEventListener('click',function(){if(validate(st.step))goStep(st.step+1);});
  $('#btnBack').addEventListener('click',function(){if(st.step>1)goStep(st.step-1);});
  inpName.addEventListener('input',function(){$('#nameCount').textContent=inpName.value.length+'/'+CFG.nameMax;inpName.classList.remove('bad');$('#err2').textContent='';});
  inpWish.addEventListener('input',function(){$('#wishCount').textContent=inpWish.value.length+'/'+CFG.wishMax;inpWish.classList.remove('bad');$('#err3').textContent='';});
  inpName.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(validate(2))goStep(3);}});
  $$('.chip').forEach(function(c){c.addEventListener('click',function(){inpWish.value=c.textContent.slice(0,CFG.wishMax);inpWish.dispatchEvent(new Event('input'));inpWish.focus();});});
  $('#btnStart').addEventListener('click',function(){openSheet(1);});
  $('#btnClose').addEventListener('click',closeSheet);$('#backdrop').addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&wrap.classList.contains('open'))closeSheet();});

  function outbox(){try{return JSON.parse(lsGet(KEY_OUT)||'[]');}catch(e){return[];}}
  function saveOutbox(q){lsSet(KEY_OUT,JSON.stringify(q.slice(-20)));}
  function flushOutbox(){
    var q=outbox();if(!q.length)return;
    var e=q[0];
    Loy.server('submitKrathong',Object.assign({dev:dev},e),15000).then(function(r){if(r&&(r.ok||r.message)){var cur=outbox();cur.shift();saveOutbox(cur);if(r.total)setTotal(r.total,r.floaters);}}).catch(function(){});
  }
  setInterval(flushOutbox,20000);setTimeout(flushOutbox,3000);

  var wait=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
  function launch(){
    if(st.busy)return;
    for(var n=1;n<=3;n++)if(!validate(n)){goStep(n);validate(n);return;}
    st.busy=true;
    var e={id:uid(),type:st.type,name:inpName.value.trim().slice(0,CFG.nameMax),wish:inpWish.value.trim().slice(0,CFG.wishMax),ts:Date.now()};
    var btn=$('#btnLaunch');btn.disabled=true;btn.querySelector('.spin').style.display='inline-block';
    closeSheet();$('#loader').classList.add('show');
    var minWait=wait(1200),failMsg='';
    Loy.server('submitKrathong',Object.assign({dev:dev},e),20000).then(function(r){
      if(r&&r.ok){if(r.total)setTotal(r.total,r.floaters);}
      else failMsg=(r&&r.message)||'ส่งไม่สำเร็จ';
    }).catch(function(){
      var q=outbox();q.push(e);saveOutbox(q);
      toast('สัญญาณไม่เสถียร เก็บกระทงของคุณไว้ แล้วจะส่งซ้ำให้อัตโนมัติ');
    }).then(function(){return minWait;}).then(function(){
      $('#loader').classList.remove('show');btn.disabled=false;btn.querySelector('.spin').style.display='none';st.busy=false;
      if(failMsg){toast(failMsg);openSheet(3);return;}
      inpWish.value='';inpWish.dispatchEvent(new Event('input'));
      // นำกระทงชื่อเดียวกันที่อาจลอยอยู่ก่อนหน้าออก เพื่อไม่ให้ซ้ำกับใบใหม่ที่กำลังจะหย่อนลงน้ำ
      scene.list().slice().forEach(function(k){
        if(!k.mine&&k.name===e.name&&(k.wish||'')===(e.wish||''))scene.remove(k,true);
      });
      e._shownAt=Date.now();
      mergeRecent([e]);
      if(total===0)setTotal(1,1);
      document.body.classList.add('floating');
      scene.add(Object.assign({origId:e.id},e),{drop:true,mine:true,d:.74,x:.5,dur:46});
      toast('ลอยกระทงเรียบร้อยแล้ว');
      setTimeout(function(){document.body.classList.remove('floating');},2200);
    });
  }
  $('#btnLaunch').addEventListener('click',launch);
}
})();
</script>
</body>
</html>
