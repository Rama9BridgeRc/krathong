<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="theme-color" content="#050a22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#f4c565;--accent-hi:#fff0c4;--accent-lo:#d9963a;
  --ink:#f3f1ff;--muted:#bcc0e6;--dim:#8f94c2;
  --glass:rgba(11,15,48,.84);--glass-b:rgba(255,255,255,.14);
  --font:'Prompt','Noto Sans Thai','Sarabun','Leelawadee UI','Thonburi',system-ui,sans-serif;
  --head:'Mitr','Prompt','Noto Sans Thai',sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050a22;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:
  radial-gradient(130% 95% at 50% 45%,transparent 58%,rgba(2,4,18,.55) 100%),
  linear-gradient(to bottom,rgba(3,6,24,.38),transparent 22%)}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:0 24px 70px rgba(2,3,18,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.grad-text{background:linear-gradient(180deg,var(--accent-hi) 8%,var(--accent) 56%,var(--accent-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:999px;font-size:16px;font-weight:500;
  transition:transform .25s var(--ease),box-shadow .25s,opacity .25s,border-color .25s}
.btn:active{transform:scale(.97)}
.btn.gold{color:#2b1906;background:linear-gradient(135deg,var(--accent-hi),var(--accent) 50%,var(--accent-lo));box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.3) inset}
.btn.ghost{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.btn[disabled]{opacity:.55;pointer-events:none}
.flamei{width:13px;height:19px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 75%,#fff 0 18%,#ffd36a 42%,#ff8a1f 86%);
  box-shadow:0 0 12px 3px rgba(255,170,60,.6);transform-origin:50% 100%;animation:flk 1.6s ease-in-out infinite alternate}
@keyframes flk{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(.94,1.08) skewX(2deg)}60%{transform:scale(1.04,.95) skewX(-2deg)}100%{transform:scale(.98,1.04) skewX(1deg)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* bubble (ข้อความเหนือกระทง) */
#bubble{position:fixed;left:0;top:0;z-index:12;width:min(300px,80vw);padding:10px 16px 12px;border-radius:16px;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;
  background:rgba(12,15,50,.9);border:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 8px 26px rgba(0,0,0,.4);will-change:transform}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);background:rgba(12,15,50,.95);border-right:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent);border-bottom:1.5px solid color-mix(in srgb,var(--accent) 60%,transparent)}
#bubble b{display:block;color:var(--accent);font-weight:500;font-size:16px;word-break:break-word}
#bubble span{display:block;margin-top:3px;font-size:15px;line-height:1.5;color:#fbf3df;font-weight:300;word-break:break-word}
#bubble:not(:has(span:not(:empty))) b{font-size:15px}
.snd{position:fixed;z-index:30;right:max(14px,env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:rgba(14,18,52,.55);border:1px solid var(--glass-b);color:var(--muted);}
.snd svg{width:20px;height:20px}
.snd.off{opacity:.6}
.snd.off .wave{display:none}
@media (prefers-reduced-motion:reduce){.flamei{animation:none}}
</style>
<script>
/* =====================================================================
   LoyScene — ฉากสายน้ำ + กระทง (วาดด้วย canvas ทั้งหมด ไม่ต้องใช้ไฟล์ภาพ)
   ===================================================================== */
(function(){
'use strict';
var TAU=Math.PI*2, FONT="'Prompt','Noto Sans Thai','Sarabun','Leelawadee UI',sans-serif";
var TYPE_LIST=['leaf','lotus','bread','coconut'];
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}

/* ---------- colour helpers ---------- */
var _hc={};
function hex(h){if(_hc[h])return _hc[h];var s=String(h).replace('#','');if(s.length===3)s=s.split('').map(function(c){return c+c;}).join('');var n=parseInt(s,16)||0;return(_hc[h]=[n>>16&255,n>>8&255,n&255]);}
function rgb(c,a){return a==null?'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
function mixc(a,b,t){a=typeof a==='string'?hex(a):a;b=typeof b==='string'?hex(b):b;return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function mx(a,b,t){return rgb(mixc(a,b,t));}

/* =====================================================================
   Krathong art  (design units, origin = waterline centre)
   ===================================================================== */
var SPR={w:270,h:240,ox:135,oy:186,k:2};
var ANCHOR={};            // flame anchor per type
var _spr={};

function ell(g,x,y,rx,ry,fill,stroke,lw){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}}
function lgr(g,x0,y0,x1,y1,st){var q=g.createLinearGradient(x0,y0,x1,y1);for(var i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}
function rgr(g,x,y,r0,r1,st){var q=g.createRadialGradient(x,y,r0,x,y,r1);for(var i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}

/* one pleated petal: left/right halves shaded separately */
function petal(g,bx,by,tx,ty,w,pal,o){
  o=o||{};
  var k=o.round?.5:.14, hh=by-ty;
  var L=[bx-w*.58+(tx-bx)*.2,by-hh*.42,tx-w*k,ty+hh*.14];
  var R=[tx+w*k,ty+hh*.14,bx+w*.58+(tx-bx)*.2,by-hh*.42];
  g.beginPath();g.moveTo(bx-w/2,by);g.bezierCurveTo(L[0],L[1],L[2],L[3],tx,ty);g.lineTo(bx,by);g.closePath();
  g.fillStyle=lgr(g,bx,by,tx,ty,[[0,pal.a0],[1,pal.a1]]);g.fill();
  g.beginPath();g.moveTo(tx,ty);g.bezierCurveTo(R[0],R[1],R[2],R[3],bx+w/2,by);g.lineTo(bx,by);g.closePath();
  g.fillStyle=lgr(g,bx,by,tx,ty,[[0,pal.b0],[1,pal.b1]]);g.fill();
  g.beginPath();g.moveTo(bx-w/2,by);g.bezierCurveTo(L[0],L[1],L[2],L[3],tx,ty);g.bezierCurveTo(R[0],R[1],R[2],R[3],bx+w/2,by);
  g.strokeStyle=o.edge||'rgba(0,25,10,.28)';g.lineWidth=.9;g.stroke();
  if(o.vein){g.beginPath();g.moveTo(bx,by-1);g.lineTo(tx,ty+2);g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=.8;g.stroke();}
}
function pal(base,tip,fold,lit){ /* lit: -1..1 brightens the lit side */
  lit=lit||0;
  var b=mixc(base,'#ffffff',Math.max(0,lit)*.22),t=mixc(tip,'#ffffff',Math.max(0,lit)*.22);
  return{a0:rgb(mixc(b,'#000',fold*.9)),a1:rgb(mixc(t,'#000',fold)),b0:rgb(mixc(b,'#fff',fold*.55)),b1:rgb(mixc(t,'#fff',fold*.55))};
}
function ring(g,cx,cy,rx,ry,o){
  var L=[],i,a,s;
  for(i=0;i<o.n;i++){a=(o.off||0)+TAU*i/o.n;s=Math.sin(a);
    if(o.side==='back'&&s>0)continue;if(o.side==='front'&&s<=0)continue;L.push({a:a,s:s,c:Math.cos(a),i:i});}
  L.sort(function(p,q){return p.s-q.s;});
  L.forEach(function(p){
    var bx=cx+rx*p.c,by=cy+ry*p.s,hh=o.h*(1+(((p.i*7)%5)-2)*.03);
    var tx=bx+p.c*(o.lean||0),ty=by-hh+p.s*(o.drop||0);
    petal(g,bx,by,tx,ty,o.w*(1+(((p.i*3)%4)-1.5)*.03),o.pal(p),o);
  });
}
function marigold(g,x,y,r){
  var i,a;ell(g,x,y+r*.12,r*1.02,r*.78,'rgba(90,40,0,.35)');
  for(i=0;i<10;i++){a=TAU*i/10+.2;ell(g,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.46,r*.38,r*.3,i%2?'#f08a10':'#f79f1a','rgba(120,50,0,.35)',.6);}
  for(i=0;i<7;i++){a=TAU*i/7;ell(g,x+Math.cos(a)*r*.34,y+Math.sin(a)*r*.26,r*.3,r*.24,'#ffbb2d');}
  ell(g,x,y,r*.26,r*.2,'#ffe37c');
}
function blossom(g,x,y,r,c1,c2,cc){
  var i,a;for(i=0;i<5;i++){a=TAU*i/5-Math.PI/2;
    g.save();g.translate(x+Math.cos(a)*r*.5,y+Math.sin(a)*r*.38);g.rotate(a*.0);
    ell(g,0,0,r*.5,r*.42,lgr(g,-r*.4,-r*.3,r*.4,r*.3,[[0,c1],[1,c2]]),'rgba(60,0,40,.25)',.6);g.restore();}
  ell(g,x,y,r*.22,r*.17,cc||'#ffe27a');
}
function candle(g,x,by,h,w){
  var top=by-h,ry=w*.42;
  g.beginPath();g.moveTo(x-w,top);g.lineTo(x-w,by);g.ellipse(x,by,w,ry,0,Math.PI,0,true);g.lineTo(x+w,top);g.closePath();
  g.fillStyle=lgr(g,x-w,0,x+w,0,[[0,'#cfbd93'],[.45,'#fffaf0'],[1,'#c2ab80']]);g.fill();
  ell(g,x,top,w,ry,'#fff7df','rgba(160,130,80,.5)',.6);
  g.beginPath();g.moveTo(x+w*.35,top+1);g.quadraticCurveTo(x+w*.75,top+7,x+w*.5,top+13);g.strokeStyle='rgba(255,246,220,.9)';g.lineWidth=2;g.lineCap='round';g.stroke();
  g.beginPath();g.moveTo(x,top);g.lineTo(x+.4,top-5);g.strokeStyle='#33200f';g.lineWidth=1.5;g.stroke();
  return top-5;
}
function incense(g,bx,by,tx,ty){
  g.beginPath();g.moveTo(bx,by);g.lineTo(tx,ty);g.strokeStyle='#6d3f1f';g.lineWidth=2.4;g.lineCap='round';g.stroke();
  g.beginPath();g.moveTo(bx,by);g.lineTo(tx,ty);g.strokeStyle='rgba(255,210,150,.35)';g.lineWidth=.8;g.stroke();
  g.fillStyle=rgr(g,tx,ty,0,6,[[0,'rgba(255,120,40,1)'],[1,'rgba(255,80,10,0)']]);g.fillRect(tx-6,ty-6,12,12);
  ell(g,tx,ty,1.6,1.6,'#ff6a2a');
}
function incenseSet(g,x,y,spread,top){
  incense(g,x-5,y,x-spread,top+4);incense(g,x+5,y,x+spread,top+4);incense(g,x,y,x+2,top-8);
}
function wallCyl(g,rx,ry,cy,th,stops){
  g.beginPath();g.moveTo(-rx,cy);g.lineTo(-rx,cy+th);g.ellipse(0,cy+th,rx,ry,0,Math.PI,0,true);g.lineTo(rx,cy);g.closePath();
  g.fillStyle=lgr(g,-rx,0,rx,0,stops);g.fill();
}

var ART={
leaf:function(g){
  var cy=-22,rx=82,ry=25,th=20;
  wallCyl(g,rx,ry,cy,th,[[0,'#bfae74'],[.38,'#f7f0cc'],[.72,'#d8c98f'],[1,'#a89658']]);
  ell(g,0,cy,rx,ry,rgr(g,-12,cy-4,4,rx,[[0,'#fffbe6'],[1,'#d9cb92']]),'rgba(120,100,40,.4)',.8);
  ring(g,0,cy,rx*.9,ry*.9,{n:14,h:66,w:36,lean:7,side:'back',vein:1,pal:function(p){return pal('#276f35','#9bd57f',.28,-p.c);}});
  ring(g,0,cy,rx*.55,ry*.55,{n:9,off:.3,h:54,w:30,lean:4,side:'back',vein:1,pal:function(p){return pal('#2f7f3b','#b4e08e',.25,-p.c);}});
  [[-30,-38],[30,-38],[-12,-44],[14,-44]].forEach(function(p){marigold(g,p[0],p[1],11);});
  incenseSet(g,0,-40,16,-122);
  var ft=candle(g,0,-30,44,5.5);
  ring(g,0,cy,rx*.9,ry*.9,{n:14,h:62,w:36,lean:9,side:'front',vein:1,pal:function(p){return pal('#2b7a3a','#a6dd88',.3,-p.c);}});
  [[-56,-6],[-24,2],[18,3],[52,-4],[0,-2]].forEach(function(p,i){marigold(g,p[0],p[1],i%2?12:14);});
  return{x:0,y:ft};
},
lotus:function(g){
  var cy=-14;
  ell(g,0,-3,104,32,rgr(g,0,-3,6,104,[[0,'#4f9a48'],[.8,'#2c6b36'],[1,'#1d4d29']]),'rgba(0,40,10,.5)',1);
  for(var i=0;i<14;i++){var a=TAU*i/14;g.beginPath();g.moveTo(0,-3);g.lineTo(Math.cos(a)*100,-3+Math.sin(a)*30);g.strokeStyle='rgba(180,230,150,.16)';g.lineWidth=1;g.stroke();}
  ring(g,0,cy,52,15,{n:9,h:74,w:50,lean:20,round:1,side:'back',pal:function(p){return pal('#fde4ee','#ee7aa4',.1,-p.c);}});
  ring(g,0,cy,32,9,{n:7,off:.4,h:62,w:40,lean:9,round:1,side:'back',pal:function(p){return pal('#ffeef4','#f08fb4',.08,-p.c);}});
  ell(g,0,-26,17,6,rgr(g,0,-26,1,17,[[0,'#ffe27a'],[1,'#d99b22']]),'rgba(120,70,0,.4)',.7);
  for(var j=0;j<9;j++)ell(g,Math.cos(j*2.1)*9,-26+Math.sin(j*2.1)*2.4,1.1,.8,'#7a4a00');
  incenseSet(g,0,-36,16,-124);
  var ft=candle(g,0,-28,46,5.5);
  ring(g,0,cy,32,9,{n:7,off:.1,h:58,w:40,lean:8,round:1,side:'front',pal:function(p){return pal('#fff0f5','#f49ab9',.08,-p.c);}});
  ring(g,0,cy,52,15,{n:9,h:68,w:50,lean:24,round:1,side:'front',pal:function(p){return pal('#fff3f7','#f088ad',.1,-p.c);}});
  return{x:0,y:ft};
},
bread:function(g){
  var cy=-34,rx=80,ry=25,th=30;
  wallCyl(g,rx,ry,cy,th,[[0,'#8e5522'],[.35,'#e3a55a'],[.7,'#c98238'],[1,'#7e481b']]);
  for(var i=0;i<26;i++){var a=rnd(0,Math.PI),x=Math.cos(a)*rx*rnd(.2,.95),y=cy+th*rnd(.2,.9)+Math.sin(a)*ry*.8;ell(g,x,y,rnd(.8,1.8),rnd(.6,1.2),'rgba(255,225,160,.35)');}
  ell(g,0,cy,rx,ry,rgr(g,-14,cy-5,4,rx,[[0,'#fbe0a4'],[.7,'#e0a55a'],[1,'#b9772f']]),'rgba(110,60,10,.45)',1);
  ell(g,0,cy,rx*.82,ry*.78,'rgba(150,90,30,.2)');
  ring(g,0,cy,rx*.86,ry*.86,{n:15,h:32,w:24,lean:5,round:1,side:'back',pal:function(p){return pal('#5fa24f','#c7e59f',.2,-p.c);}});
  blossom(g,-34,cy-10,12,'#d58cf0','#a24fcf','#ffe27a');blossom(g,34,cy-10,12,'#ff9cc1','#e0558a','#ffe27a');
  incenseSet(g,0,cy-8,16,-124);
  var ft=candle(g,0,cy-4,46,5.5);
  ring(g,0,cy,rx*.86,ry*.86,{n:15,h:30,w:24,lean:7,round:1,side:'front',pal:function(p){return pal('#5fa24f','#d4eca9',.2,-p.c);}});
  blossom(g,-50,cy+4,13,'#d58cf0','#a24fcf','#ffe27a');blossom(g,-8,cy+11,14,'#ffb0cd','#e0558a','#ffe27a');blossom(g,40,cy+6,13,'#d58cf0','#a24fcf','#ffe27a');
  marigold(g,14,cy-12,9);
  return{x:0,y:ft};
},
coconut:function(g){
  var cy=-30,rx=66,ry=21;
  g.beginPath();g.moveTo(-rx,cy);g.bezierCurveTo(-rx-2,cy+34,-38,cy+46,0,cy+46);g.bezierCurveTo(38,cy+46,rx+2,cy+34,rx,cy);g.ellipse(0,cy,rx,ry,0,0,Math.PI);g.closePath();
  g.fillStyle=rgr(g,-18,cy+6,6,rx*1.3,[[0,'#9a6238'],[.55,'#5d361c'],[1,'#2e180b']]);g.fill();
  for(var i=0;i<46;i++){var x=rnd(-rx*.9,rx*.9),y=cy+rnd(8,40)*(1-Math.abs(x)/rx*.35);g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(-3,3),y+rnd(3,7));g.strokeStyle=Math.random()<.5?'rgba(255,220,170,.18)':'rgba(0,0,0,.25)';g.lineWidth=.8;g.stroke();}
  ell(g,0,cy,rx,ry,'#e0c898','rgba(60,30,10,.7)',2.2);
  ell(g,0,cy+1,rx-4,ry-3,rgr(g,0,cy,3,rx,[[0,'#7a4a28'],[1,'#3a2010']]));
  ring(g,0,cy,rx*.8,ry*.8,{n:11,h:72,w:24,lean:22,side:'back',vein:1,pal:function(p){return pal('#2a7536','#8fd274',.3,-p.c);}});
  ring(g,0,cy,rx*.45,ry*.45,{n:7,off:.5,h:52,w:20,lean:8,side:'back',vein:1,pal:function(p){return pal('#33853f','#a9e08c',.26,-p.c);}});
  incenseSet(g,0,cy-6,16,-122);
  var ft=candle(g,0,cy-2,44,5.5);
  ring(g,0,cy,rx*.8,ry*.8,{n:10,h:44,w:22,lean:16,side:'front',vein:1,pal:function(p){return pal('#2f7e3b','#9edb82',.3,-p.c);}});
  [[-42,cy+8],[-14,cy+14],[16,cy+13],[44,cy+7]].forEach(function(p,i){blossom(g,p[0],p[1],9,'#ffffff','#e7e7ef','#f5c52a');});
  marigold(g,-26,cy-2,9);marigold(g,28,cy-1,9);
  return{x:0,y:ft};
}};

function getSprite(type){
  if(_spr[type])return _spr[type];
  var c=mk(SPR.w*SPR.k,SPR.h*SPR.k),g=c.getContext('2d');
  g.scale(SPR.k,SPR.k);g.translate(SPR.ox,SPR.oy);
  ANCHOR[type]=ART[type](g);
  return(_spr[type]=c);
}

/* pre-rendered soft sprites (cheap to draw every frame) */
var _soft=null;
function softSprites(){
  if(_soft)return _soft;
  function soft(w,h,st){var c=mk(w,h),x=c.getContext('2d');x.translate(w/2,h/2);x.scale(1,h/w);x.fillStyle=rgr(x,0,0,0,w/2,st);x.beginPath();x.arc(0,0,w/2,0,TAU);x.fill();return c;}
  var streak=mk(64,96),sx=streak.getContext('2d');
  for(var j=0;j<6;j++){var yy=8+j*13,aa=.34*(1-j/6);sx.fillStyle='rgba(255,176,90,'+aa+')';sx.beginPath();sx.ellipse(32,yy,15-j*1.8,2.6,0,0,TAU);sx.fill();}
  _soft={
    shadow:soft(256,72,[[0,'rgba(2,6,22,.5)'],[1,'rgba(2,6,22,0)']]),
    light:soft(256,72,[[0,'rgba(255,170,80,.42)'],[1,'rgba(255,140,50,0)']]),
    glow:soft(128,128,[[0,'rgba(255,190,90,.55)'],[.4,'rgba(255,150,50,.2)'],[1,'rgba(255,120,40,0)']]),
    streak:streak
  };
  return _soft;
}

/* flame + glow ; (0,0) is the flame base ; s = flicker seed */
function drawFlame(g,t,s,glowK){
  var f1=Math.sin(t*9+s*7)*.5+Math.sin(t*14.3+s*3)*.5,f2=Math.sin(t*6.1+s*5);
  var sx=1+f1*.05,sy=1+f2*.08,sk=f1*.12;
  var gk=(glowK==null?1:glowK)*(.86+f2*.1);
  g.save();g.globalCompositeOperation='lighter';g.globalAlpha=Math.min(1,gk);
  g.drawImage(softSprites().glow,-52,-66,104,104);
  g.restore();
  g.save();g.transform(sx,0,sk,sy,0,0);
  g.beginPath();g.moveTo(0,0);g.bezierCurveTo(-8,-1,-10,-9,-6.5,-17);g.bezierCurveTo(-4,-22,-1.4,-27,0,-35);g.bezierCurveTo(1.7,-27,4.8,-22.4,6.8,-17);g.bezierCurveTo(10,-9,8,-1,0,0);
  g.fillStyle=lgr(g,0,0,0,-35,[[0,'#ff6a12'],[.45,'#ffa72e'],[1,'rgba(255,224,138,.92)']]);g.fill();
  g.beginPath();g.moveTo(0,-1);g.bezierCurveTo(-4.4,-2,-5.8,-7.8,-3.6,-12.6);g.bezierCurveTo(-2,-16,-.6,-19,0,-24);g.bezierCurveTo(1.3,-19.4,3.2,-16.4,4,-12.6);g.bezierCurveTo(5.8,-7.8,4.4,-2,0,-1);
  g.fillStyle='#fff6d0';g.fill();
  ell(g,0,-3.5,2.4,3.2,'rgba(150,190,255,.55)');
  g.restore();
}

/* full krathong at origin = waterline centre (caller has translated/scaled) */
function drawKrathong(g,type,t,seed,opt){
  opt=opt||{};
  var spr=getSprite(type),an=ANCHOR[type],gk=.86+Math.sin(t*6.1+seed*5)*.1,SS=softSprites();
  if(!opt.noWater){
    g.drawImage(SS.shadow,-100,-18,200,52);
    for(var i=0;i<2;i++){var u=((t*.42+seed+i*.5)%1),rx=84+u*46;g.beginPath();g.ellipse(0,8,rx,rx*.27,0,0,TAU);g.strokeStyle='rgba(205,228,255,'+(.3*(1-u))+')';g.lineWidth=1.6;g.stroke();}
    g.save();g.globalCompositeOperation='lighter';g.globalAlpha=gk;
    g.drawImage(SS.light,-118,-21,236,66);
    g.drawImage(SS.streak,-32+Math.sin(t*2.2+seed*9)*3,20,64,96);
    g.restore();
  }
  g.drawImage(spr,-SPR.ox,-SPR.oy,SPR.w,SPR.h);
  g.save();g.translate(an.x,an.y);drawFlame(g,t,seed,gk);g.restore();
}

/* preview for cards etc. */
function preview(cv,type,t){
  var r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.round((r.width||cv.clientWidth||160)*dpr),h=Math.round((r.height||cv.clientHeight||140)*dpr);
  if(!w||!h)return;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  var g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,w,h);
  var S=Math.min(w/232,h/196);
  g.translate(w/2,h*.86+Math.sin(t*1.4)*1.5*dpr);g.scale(S,S);
  drawKrathong(g,type,t,.37,{noWater:true});
}

/* =====================================================================
   The scene (sky · river · krathongs)
   ===================================================================== */
function LoyScene(cv,cfg,o){
  o=o||{};
  var mode=o.mode||'phone',g=cv.getContext('2d'),dir=cfg.flow==='left'?-1:1;
  var LOW=mode==='phone'&&((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3||window.innerWidth<420);
  var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var water=hex(cfg.waterColor),acc=hex(cfg.accent);
  var W=0,H=0,dpr=1,hy=0,wh=0,unit=100;
  var bgC=null,reflC=null,rw=0,rh=0,bgImg=null,bgUrl='',stars=[],streaks=[],petals=[],lanterns=[],ripples=[],krs=[],lanes=[],laneUse={};
  var running=true,last=0,T=0,handlers={},bubble=null,bubbleK=null,bubbleUntil=0,laneSeq=0;
  var maxK=cfg.maxOnScreen||36;

  function on(ev,fn){handlers[ev]=fn;}
  function emit(ev,a,b){if(handlers[ev])handlers[ev](a,b);}

  /* ---------- sizing ---------- */
  function resize(){
    var vw=window.innerWidth,vh=window.innerHeight,portrait=vh>vw*1.05;
    var cap=mode==='display'?2.4e6:1.6e6;
    dpr=Math.min(window.devicePixelRatio||1,mode==='display'?1.5:2);
    if(vw*vh*dpr*dpr>cap)dpr=Math.sqrt(cap/(vw*vh));
    W=vw;H=vh;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);

    chooseBg(portrait);
    var hv=portrait?cfg.horizonMobile:cfg.horizon,hz;
    if(hv>0)hz=hv/100;                                   // กำหนดเอง
    else if(bgImg&&bgImg.naturalWidth)hz=clamp(W*(bgImg.naturalHeight/bgImg.naturalWidth)/H,portrait?.32:.3,portrait?.55:.55); // อัตโนมัติ: พอดีกับสัดส่วนภาพ
    else hz=portrait?.42:.5;
    hy=Math.round(H*hz);wh=H-hy;
    unit=mode==='display'?Math.min(W*.115,H*.19,wh*.36):Math.min(W*.30,H*.16);
    if(portrait&&mode==='display')unit=Math.min(W*.2,H*.12,wh*.36);
    lanes=[];var n=mode==='display'?9:6;for(var i=0;i<n;i++)lanes.push(.06+.9*i/(n-1));
    buildBg();
    var N=Math.round((mode==='display'?150:90)*(LOW?.5:1)*Math.min(1.4,W*wh/(1920*540)+.3));
    streaks=[];for(var s=0;s<N;s++)streaks.push({x:rnd(0,W),yj:rnd(-1,1),len:rnd(34,120),sp:rnd(.6,1.5),ph:rnd(0,TAU)});
    var P=LOW?8:(mode==='display'?22:14);
    petals=[];for(var p=0;p<P;p++)petals.push(newPetal(true));
  }
  function newPetal(init){return{x:init?rnd(0,W):(dir>0?-20:W+20),f:Math.pow(Math.random(),.9),r:rnd(.7,1.3),sp:rnd(.7,1.2),a:rnd(0,TAU),c:['#ffb6cf','#ffd27a','#ffffff','#ff9d5a'][(Math.random()*4)|0]};}

  /* ---------- background ---------- */
  function chooseBg(portrait){
    var url=(portrait&&cfg.bgImageMobile)?cfg.bgImageMobile:cfg.bgImage;
    if(url===bgUrl)return;
    bgUrl=url;bgImg=null;
    if(!url)return;
    var im=new Image();
    im.onload=function(){if(bgUrl===url){bgImg=im;resize();emit('bg',true);}};
    im.onerror=function(){if(bgUrl===url){bgImg=null;emit('bg',false);if(window.console)console.warn('โหลดภาพฉากหลังไม่สำเร็จ — ตรวจสอบลิงก์/การแชร์ไฟล์');}};
    im.referrerPolicy='no-referrer';
    im.src=url;
  }
  function buildBg(){
    var s=Math.min(dpr,1.5),bw=Math.ceil(W*s),bh=Math.max(2,Math.ceil(hy*s));
    bgC=mk(bw,bh);var b=bgC.getContext('2d');
    if(bgImg&&bgImg.naturalWidth){
      var iw=bgImg.naturalWidth,ih=bgImg.naturalHeight,sc=Math.max(bw/iw,bh/ih),dw=iw*sc,dh=ih*sc;
      var dx=-(dw-bw)*cfg.bgFocusX/100,dy=-(dh-bh)*(cfg.bgFocusY==null?100:cfg.bgFocusY)/100;
      b.drawImage(bgImg,dx,dy,dw,dh);
      if(cfg.dim>0){b.fillStyle='rgba(3,8,30,'+(cfg.dim/100)+')';b.fillRect(0,0,bw,bh);}
      b.fillStyle=lgr(b,0,0,0,bh*.4,[[0,'rgba(2,5,22,.5)'],[1,'rgba(2,5,22,0)']]);b.fillRect(0,0,bw,bh);
    }else defaultSky(b,bw,bh);
    // reflection texture (mirrored, low-res => soft)
    rw=Math.ceil(W/3);rh=Math.max(2,Math.ceil(wh/3));
    reflC=mk(rw,rh);var r=reflC.getContext('2d');
    var srcPx=Math.min(bh,bh*(wh/hy)*.95);
    try{r.filter='blur(1.2px)';}catch(e){}
    r.scale(1,-1);r.drawImage(bgC,0,bh-srcPx,bw,srcPx,0,-rh,rw,rh);
    stars=[];if(!(bgImg&&bgImg.naturalWidth)){var n=LOW?50:110;for(var i=0;i<n;i++)stars.push({x:rnd(0,W),y:rnd(0,hy*.82),r:rnd(.4,1.5),ph:rnd(0,TAU),sp:rnd(.6,2)});}
  }
  function defaultSky(b,w,h){
    b.fillStyle=lgr(b,0,0,0,h,[[0,'#030820'],[.5,'#0e2766'],[.82,'#33589a'],[1,'#d99d70']]);b.fillRect(0,0,w,h);
    var mxp=w*.76,myp=h*.4,mr=Math.min(w,h*1.5)*.055;
    b.fillStyle=rgr(b,mxp,myp,mr*.5,mr*6,[[0,'rgba(255,238,200,.35)'],[1,'rgba(255,238,200,0)']]);b.fillRect(mxp-mr*6,myp-mr*6,mr*12,mr*12);
    b.beginPath();b.arc(mxp,myp,mr,0,TAU);b.fillStyle=rgr(b,mxp-mr*.3,myp-mr*.3,mr*.1,mr,[[0,'#fffaf0'],[1,'#f4e2b8']]);b.fill();
    [[.3,-.25,.22],[-.35,.2,.28],[.1,.4,.18],[-.1,-.45,.14]].forEach(function(c){b.beginPath();b.arc(mxp+c[0]*mr,myp+c[1]*mr,c[2]*mr,0,TAU);b.fillStyle='rgba(190,160,110,.18)';b.fill();});
    // far hills
    b.beginPath();b.moveTo(0,h);for(var x=0;x<=w;x+=6){b.lineTo(x,h*.8-Math.sin(x/w*5.2+1)*h*.05-Math.sin(x/w*13)*h*.02);}b.lineTo(w,h);b.closePath();b.fillStyle='#10245a';b.fill();
    // chedi silhouette (กลาง ๆ)
    var cx=w*.2,base=h*.86,ch=h*.34,cw=ch*.34;
    b.fillStyle='#060d2a';b.beginPath();b.moveTo(cx-cw,base);b.bezierCurveTo(cx-cw*.95,base-ch*.3,cx-cw*.5,base-ch*.45,cx-cw*.2,base-ch*.72);b.lineTo(cx,base-ch);b.lineTo(cx+cw*.2,base-ch*.72);b.bezierCurveTo(cx+cw*.5,base-ch*.45,cx+cw*.95,base-ch*.3,cx+cw,base);b.closePath();b.fill();
    b.fillRect(cx-cw*1.25,base-ch*.06,cw*2.5,ch*.06+4);
    // tree line
    var rs=function(seed){return function(){seed=(seed*16807)%2147483647;return seed/2147483647;};}(7),i;
    b.fillStyle='#050a21';b.beginPath();b.moveTo(0,h);
    for(i=0;i<=w;i+=5){var hh=h*(.9-.035*Math.sin(i/w*9)-.05*rs()*(Math.sin(i/37)>0?1:.4));b.lineTo(i,hh);}
    b.lineTo(w,h);b.closePath();b.fill();
    for(i=0;i<14;i++){var lx=rs()*w,ly=h*(.92+rs()*.05);b.fillStyle=rgr(b,lx,ly,0,7,[[0,'rgba(255,200,120,.9)'],[1,'rgba(255,170,80,0)']]);b.fillRect(lx-7,ly-7,14,14);}
  }

  /* ---------- geometry ---------- */
  function laneY(d){return hy+wh*(.09+(mode==='display'?.6:.7)*Math.pow(d,1.1));}
  function laneS(d){return(.34+.8*d)*unit/200;}
  function pickLane(xFrac){
    var best=0,bu=1e9,pr=xFrac==null?(dir>0?-.07:1.07):(dir>0?xFrac:1-xFrac);
    for(var i=0;i<lanes.length;i++){
      var u=(laneUse[i]||0)+Math.random()*2.5;
      for(var j=0;j<krs.length;j++){var q=krs[j];if(Math.abs(q.d-lanes[i])<.01&&Math.abs(q.prog-pr)<.2)u+=40;}
      if(u<bu){bu=u;best=i;}
    }
    laneUse[best]=++laneSeq;return lanes[best];
  }
  var laneJit={};
  function durFor(d){var key=d.toFixed(2);if(!laneJit[key])laneJit[key]=rnd(.9,1.1);return(mode==='display'?lerp(125,66,d):lerp(95,52,d))*laneJit[key]*(RM?1.6:1);}

  /* ---------- label sprite ---------- */
  function makeLabel(text,wish){
    var fs=19,fs2=15,maxW=250,c=mk(10,10),x=c.getContext('2d');
    x.font='500 '+fs*2+'px '+FONT;
    var name=text;while(x.measureText(name).width>maxW*2&&name.length>1)name=name.slice(0,-1);if(name!==text)name=name.slice(0,-1)+'…';
    var nw=x.measureText(name).width,lines=[],ww=0;
    if(wish){
      x.font='300 '+fs2*2+'px '+FONT;
      var cur='',chs=Array.from(wish);
      for(var i=0;i<chs.length;i++){
        if(x.measureText(cur+chs[i]).width>maxW*2&&cur){lines.push(cur);cur=chs[i];if(lines.length===2)break;}else cur+=chs[i];
      }
      if(lines.length<2&&cur)lines.push(cur);
      if(chs.join('').length>lines.join('').length&&lines.length){var L=lines[lines.length-1];while(x.measureText(L+'…').width>maxW*2&&L.length>1)L=L.slice(0,-1);lines[lines.length-1]=L+'…';}
      lines.forEach(function(l){ww=Math.max(ww,x.measureText(l).width);});
    }
    var w=Math.ceil(Math.max(nw,ww)+56),lh1=fs*2*1.55,lh2=fs2*2*1.45,h=Math.ceil(lh1+lines.length*lh2+(lines.length?10:0)+8);
    c.width=w;c.height=h;x=c.getContext('2d');
    x.fillStyle='rgba(8,14,46,.72)';rr(x,1,1,w-2,h-2,Math.min(h/2,36));x.fill();
    x.strokeStyle=rgb(acc,.5);x.lineWidth=2;x.stroke();
    x.textBaseline='middle';x.textAlign='center';
    x.font='500 '+fs*2+'px '+FONT;x.fillStyle=rgb(mixc(acc,'#ffffff',.65));
    x.fillText(name,w/2,4+lh1/2+2);
    x.font='300 '+fs2*2+'px '+FONT;x.fillStyle='#fff3d8';
    lines.forEach(function(l,i){x.fillText(l,w/2,4+lh1+5+i*lh2+lh2/2);});
    return{c:c,w:w/2,h:h/2};
  }
  function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

  /* ---------- krathong management ---------- */
  function addKrathong(e,opt){
    opt=opt||{};
    if(mode!=='display'&&krs.length>=maxK+4){var v=null,mp=-1;krs.forEach(function(k){var p=k.mine?-1:k.prog;if(!k.mine&&p>mp){mp=p;v=k;}});if(v){remove(v,true);emit('evict',v);}}
    var d=opt.d!=null?opt.d:pickLane(opt.x);
    var type=TYPE_LIST.indexOf(e.type)>=0?e.type:TYPE_LIST[(Math.random()*4)|0];
    var k={id:e.id||('a'+Math.random().toString(36).slice(2,8)),type:type,name:e.name||'',wish:e.wish||'',ts:e.ts||0,anon:!e.name,
      d:d,dur:opt.dur||durFor(d),seed:Math.random(),x:0,prog:0,mine:!!opt.mine,born:T,drop:opt.drop?1.0:0,splashed:!opt.drop,sx:-999,sy:-999,S:1,fresh:!!opt.drop};
    if(opt.x!=null)k.prog=dir>0?opt.x:1-opt.x;else k.prog=dir>0?-.07:1.07;
    k.x=(dir>0?k.prog:1-k.prog)*W;
    k.label=k.name?makeLabel(k.name,k.wish):null;
    getSprite(type);
    krs.push(k);return k;
  }
  function remove(k,silent){var i=krs.indexOf(k);if(i>=0)krs.splice(i,1);if(bubbleK===k)hideBubble();if(!silent)emit('exit',k);}
  function splash(x,y,S){for(var i=0;i<3;i++)ripples.push({x:x,y:y,S:S,t0:T+i*.22,life:1.9});}

  /* ---------- bubble ---------- */
  function ensureBubble(){if(bubble)return bubble;bubble=document.getElementById('bubble');if(!bubble){bubble=document.createElement('div');bubble.id='bubble';bubble.innerHTML='<b></b><span></span>';document.body.appendChild(bubble);}return bubble;}
  function showBubble(k,ms){
    if(!k)return;var b=ensureBubble();bubbleK=k;bubbleUntil=T+(ms||5200)/1000;
    b.querySelector('b').textContent=k.name||'กระทงแห่งความหวัง';
    b.querySelector('span').textContent=k.wish||'';
    b.classList.add('on');
  }
  function hideBubble(){bubbleK=null;if(bubble)bubble.classList.remove('on');}

  /* ---------- draw ---------- */
  function drawSky(){
    g.drawImage(bgC,0,0,W,hy);
    if(stars.length){for(var i=0;i<stars.length;i++){var s=stars[i];g.globalAlpha=.25+.75*(.5+.5*Math.sin(T*s.sp+s.ph));g.fillStyle='#fff';g.fillRect(s.x,s.y,s.r,s.r);}g.globalAlpha=1;}
    if(cfg.lanterns){
      if(lanterns.length<(LOW?3:6)&&Math.random()<.01)lanterns.push({x:rnd(.05,.95)*W,y:hy*rnd(.82,.98),vy:rnd(7,14),vx:rnd(-3,3),s:rnd(.7,1.2),ph:rnd(0,TAU),a:0});
      g.save();g.globalCompositeOperation='lighter';
      for(var j=lanterns.length-1;j>=0;j--){var l=lanterns[j];l.y-=l.vy*dtG;l.x+=Math.sin(T*.5+l.ph)*5*dtG+l.vx*dtG;
        var fade=Math.min(1,(hy-l.y)/(hy*.12))*Math.min(1,l.y/(hy*.28));l.a=clamp(fade,0,1);
        if(l.y<-30){lanterns.splice(j,1);continue;}
        var sz=unit*.1*l.s,f=.8+.2*Math.sin(T*3+l.ph);
        g.globalAlpha=l.a*.9;
        g.fillStyle=rgr(g,l.x,l.y,0,sz*3.2,[[0,'rgba(255,190,100,.5)'],[1,'rgba(255,150,60,0)']]);g.fillRect(l.x-sz*3.2,l.y-sz*3.2,sz*6.4,sz*6.4);
        g.beginPath();g.moveTo(l.x-sz*.26,l.y-sz*.5);g.lineTo(l.x+sz*.26,l.y-sz*.5);g.lineTo(l.x+sz*.42,l.y+sz*.45);g.lineTo(l.x-sz*.42,l.y+sz*.45);g.closePath();
        g.fillStyle=lgr(g,0,l.y-sz*.5,0,l.y+sz*.45,[[0,'rgba(255,120,30,'+(.55+.2*f)+')'],[1,'rgba(255,190,80,'+(.85+.15*f)+')']]);g.fill();
        g.fillStyle='rgba(255,236,170,'+(.5*f)+')';g.beginPath();g.arc(l.x,l.y+sz*.3,sz*.14,0,TAU);g.fill();
      }
      g.restore();g.globalAlpha=1;
    }
  }
  var dtG=.016;
  var waterC=null,waterT=-1,ws=1;
  function paintWater(){
    ws=mode==='display'?.75:1;
    var ww=Math.ceil(W*ws),wH=Math.ceil(wh*ws);
    if(!waterC||waterC.width!==ww||waterC.height!==wH){waterC=mk(ww,wH);}
    var q=waterC.getContext('2d');q.setTransform(ws,0,0,ws,0,0);
    var wl=mixc(water,'#ffffff',.14),wd=mixc(water,'#000000',.55);
    q.fillStyle=lgr(q,0,0,0,wh,[[0,rgb(wl)],[.45,rgb(water)],[1,rgb(wd)]]);q.fillRect(0,0,W,wh);
    if(cfg.reflection&&reflC){
      var step=LOW?4:3;
      for(var y=0;y<wh;y+=step){
        var f=y/wh,amp=1+f*10,dx=Math.sin(y*.05+T*1.15)*amp+Math.sin(y*.13-T*.8)*amp*.45;
        q.globalAlpha=.62*(1-f*.8);
        q.drawImage(reflC,0,Math.min(rh-1,(y/3)|0),rw,1,dx-14,y,W+28,step);
      }
      q.globalAlpha=1;
    }
    q.fillStyle=lgr(q,0,0,0,Math.min(70,wh*.2),[[0,'rgba(200,222,255,.2)'],[1,'rgba(200,222,255,0)']]);q.fillRect(0,0,W,Math.min(70,wh*.2));
    q.fillStyle=lgr(q,0,0,0,wh,[[0,rgb(water,.0)],[1,rgb(wd,.55)]]);q.fillRect(0,0,W,wh);
    q.fillStyle='rgba(210,230,255,.35)';q.fillRect(0,0,W,1);
    waterT=T;
  }
  function drawWater(){
    var top=hy;
    if(waterT<0||T-waterT>.045||!waterC)paintWater();
    g.drawImage(waterC,0,top,W,wh);
    // flowing streaks (batched per depth bucket)
    g.lineCap='round';
    var NB=5,bi;
    for(bi=0;bi<NB;bi++){
      var fb=(bi+.5)/NB,persp=.22+.78*fb;
      g.beginPath();
      for(var i=bi;i<streaks.length;i+=NB){
        var s=streaks[i],yy=top+wh*(.03+.95*fb);
        s.x+=dir*dtG*s.sp*(16+34*fb)*(unit/160);
        if(dir>0&&s.x>W+s.len)s.x=-s.len;else if(dir<0&&s.x<-s.len)s.x=W+s.len;
        var L=s.len*persp,wob=Math.sin(T*.9+s.ph)*1.6*persp,yj=yy+s.yj*wh*.1*persp;
        g.moveTo(s.x,yj);g.quadraticCurveTo(s.x+dir*L*.5,yj+wob,s.x+dir*L,yj);
      }
      g.strokeStyle='rgba(205,228,255,'+(.15*(.45+.55*fb)*2.2).toFixed(3)+')';g.lineWidth=.8+2.4*persp;g.stroke();
    }
    // floating petals (current)

var scene=Loy.Scene($('#scene'),CFG,{mode:'display'});
var snd=Loy.music(CFG,$('#btnSound'));
var pool=[],seen={},onScreen={},rot=0,since=0,total=0,fails=0,fresh=[],bannerBusy=false;
var MAXK=CFG.maxOnScreen,AMB=CFG.ambient;

function setStat(ok,txt){var s=$('#stat');s.className='dstat '+(ok?'ok':'err');s.querySelector('span').textContent=txt;}
function setTotal(n){total=n;$('#count').textContent=n.toLocaleString('th-TH');}
function target(){return Math.min(MAXK,Math.max(AMB,pool.length));}
function nextFromPool(){
  var wait={};fresh.forEach(function(f){wait[f.id]=1;});
  var c=pool.filter(function(e){return !onScreen[e.id]&&!wait[e.id];});
  return c.length?c[(Math.random()*c.length)|0]:null;   // สุ่ม ไม่เรียงลำดับ
}
function spawn(e,opt){
  var k=scene.add(e,opt||{});onScreen[k.id]=1;return k;
}
function fill(){
  if(scene.count()>=MAXK||scene.count()>=target())return;     // เต็มแล้ว รอให้กระทงไหลออกก่อน
  var e=nextFromPool(),off=Math.random()*.3,sx=CFG.flow==='left'?1+off:-off;   // เริ่มนอกจอแบบสุ่มระยะ → ไหลเข้ามาไม่พร้อมกัน
  if(e)spawn(e,{x:sx});
  else if(scene.count()<AMB)spawn({id:'a'+Math.random().toString(36).slice(2,8),type:Loy.TYPES[(Math.random()*4)|0]},{x:sx});
}
scene.on('exit',function(k){delete onScreen[k.id];});
scene.on('evict',function(k){delete onScreen[k.id];});
(function tick(){fill();setTimeout(tick,600+Math.random()*2000);})();   // ปล่อยกระทงออกมาแบบสุ่มจังหวะ

function ingest(items,initial){
  items.forEach(function(e){
    if(!e.id||seen[e.id])return;seen[e.id]=1;
    pool.push(e);if(e.ts>since)since=e.ts;
    if(!initial)fresh.push(e);
  });
  if(pool.length>400)pool.splice(0,pool.length-400);
  if(fresh.length>5)fresh=fresh.slice(-5);
}

/* ---------- banner for new arrivals ---------- */
function runBanner(){
  if(bannerBusy||!fresh.length||scene.count()>=MAXK)return;   // เต็ม → รอจนมีที่ว่างก่อนปล่อยใบใหม่
  var e=fresh.shift();bannerBusy=true;
  var fx=.12+Math.random()*.22,k=spawn(e,{drop:true,x:CFG.flow==='left'?1-fx:fx});
  $('#bnName').textContent=e.name;$('#bnWish').textContent=e.wish||'';$('#bnWish').hidden=!e.wish;
  $('#banner').classList.add('show');
  setTimeout(function(){$('#banner').classList.remove('show');setTimeout(function(){bannerBusy=false;runBanner();},700);},fresh.length>3?3800:6200);
}
setInterval(runBanner,900);

scene.on('tap',function(k){scene.showBubble(k,6500);});

/* ---------- data ---------- */
function poll(){
  Loy.server('getSince',since,25000).then(function(r){
    fails=0;setStat(true,'เชื่อมต่อแล้ว');
    if(r){setTotal(r.total||total);ingest(r.items||[],false);}
  }).catch(function(){fails++;if(fails>=2)setStat(false,'เชื่อมต่อไม่ได้ กำลังลองใหม่…');})
  .then(function(){setTimeout(poll,CFG.pollSeconds*1000);});
}
Loy.server('getRecent',80,25000).then(function(r){
  setStat(true,'เชื่อมต่อแล้ว');
  if(r){setTotal(r.total||0);ingest(r.items||[],true);if(r.items&&r.items.length)since=Math.max(since,r.items[r.items.length-1].ts);}
}).catch(function(){setStat(false,'เชื่อมต่อไม่ได้ กำลังลองใหม่…');})
.then(function(){
  // initial population spread across the river
  var n=Math.min(target(),pool.length?target():AMB),i,xs=[];
  for(i=0;i<n;i++)xs.push((i+Math.random()*.8)/n);
  xs.sort(function(){return Math.random()-.5;});
  for(i=0;i<n;i++){var e=nextFromPool();if(e)spawn(e,{x:xs[i]});else spawn({id:'a'+Math.random().toString(36).slice(2,8),type:Loy.TYPES[(Math.random()*4)|0]},{x:xs[i]});}
  setTimeout(poll,CFG.pollSeconds*1000);
});

/* ---------- fullscreen / idle cursor / wake lock ---------- */
function toggleFs(){var d=document,el=d.documentElement;try{if(!d.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);else(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(e){}snd.start();}
$('#btnFs').addEventListener('click',toggleFs);
document.addEventListener('keydown',function(e){if(e.key==='f'||e.key==='F')toggleFs();});
var idleT;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle');},3500);}
['mousemove','pointerdown','keydown'].forEach(function(ev){window.addEventListener(ev,wake,{passive:true});});wake();
try{if(navigator.wakeLock){var lock=function(){navigator.wakeLock.request('screen').catch(function(){});};lock();document.addEventListener('visibilitychange',function(){if(!document.hidden)lock();});}}catch(e){}
})();

}else{

(function(){
'use strict';
var CFG=window.CFG;
var $=function(s){return document.querySelector(s);},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
var TYPE_INFO={
  leaf:{name:CFG.types.leaf,tag:'ใบตองพับกลีบ ประดับดาวเรือง แบบดั้งเดิม'},
  lotus:{name:CFG.types.lotus,tag:'กลีบบัวสีชมพูอ่อนหวาน งามสง่า'},
  bread:{name:CFG.types.bread,tag:'ย่อยสลายได้ เป็นอาหารให้ปลา'},
  coconut:{name:CFG.types.coconut,tag:'แข็งแรง ลอยสวย ใช้วัสดุธรรมชาติ'}
};
var CHIPS=['ขอให้ครอบครัวมีความสุข','ขอให้สุขภาพแข็งแรง','ขอให้การงานก้าวหน้า','ขอให้สมหวังดังตั้งใจ','ขอให้ความทุกข์ลอยไปกับสายน้ำ','ขอให้โชคดีตลอดปี'];
var KEY_DEV='loy-dev',KEY_OUT='loy-outbox';

Loy.applyTheme(CFG);
document.title=CFG.title+' · '+CFG.orgName;
$('#orgName').textContent=CFG.orgName;
$('#title').textContent=CFG.title;
$('#subtitle').textContent=CFG.subtitle;$('#subtitle').hidden=!CFG.subtitle;
$('#btnText').textContent=CFG.buttonText;
if(CFG.footer)$('#foot').textContent=CFG.footer;
if(CFG.logo){var lg=$('#logo');lg.onerror=function(){lg.hidden=true;};lg.src=CFG.logo;lg.hidden=false;}
if(!CFG.eventOpen){$('#btnStart').hidden=true;var cm=$('#closedMsg');cm.textContent=CFG.closedText;cm.hidden=false;}

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var dev=lsGet(KEY_DEV);if(!dev){dev=Math.random().toString(36).slice(2,12)+Date.now().toString(36);lsSet(KEY_DEV,dev);}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},3200);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- scene ---------- */
var scene=Loy.Scene($('#scene'),CFG,{mode:'phone'});
var snd=Loy.music(CFG,$('#btnSound'));
var recent=[],total=0;
function anon(){return{type:Loy.TYPES[(Math.random()*4)|0]};}
function spawnAmbient(atEdge){
  var e=(recent.length&&Math.random()<.7)?recent[(Math.random()*recent.length)|0]:anon();
  scene.add({id:'r'+uid(),type:e.type,name:e.name,wish:e.wish},atEdge?{}:{x:Math.random()*.9+.05});
}
var AMB=Math.min(CFG.ambient,innerWidth<420?5:8);
for(var i=0;i<AMB;i++)spawnAmbient(false);
scene.on('exit',function(k){if(!k.mine)spawnAmbient(true);});
scene.on('tap',function(k){scene.showBubble(k,5200);});
function setTotal(n){total=n;$('#total').textContent=n.toLocaleString('th-TH');$('#counter').hidden=false;}
Loy.server('getRecent',14).then(function(r){
  if(!r)return;recent=(r.items||[]);setTotal(r.total||0);
  recent.slice(-AMB).forEach(function(e){scene.add(e,{x:Math.random()*.9+.05});});
  // keep total ambient bounded
  var list=scene.list();while(list.length>AMB+4){scene.remove(list.filter(function(k){return k.anon;})[0]||list[0],true);}
}).catch(function(){});

/* ---------- sheet ---------- */
var st={step:1,type:null,busy:false,raf:0};
var wrap=$('#sheetWrap'),inpName=$('#inpName'),inpWish=$('#inpWish');
inpName.maxLength=CFG.nameMax;inpWish.maxLength=CFG.wishMax;
$('#nameCount').textContent='0/'+CFG.nameMax;$('#wishCount').textContent='0/'+CFG.wishMax;
if(CFG.wishRequired)$('#optTag').textContent='';
var tick='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
$('#cards').innerHTML=Loy.TYPES.map(function(t){return '<button class="card" type="button" role="radio" aria-checked="false" data-t="'+t+'"><span class="tick">'+tick+'</span><canvas></canvas><b>'+TYPE_INFO[t].name+'</b><small>'+TYPE_INFO[t].tag+'</small></button>';}).join('');
$('#chips').innerHTML=CHIPS.map(function(c){return '<button class="chip" type="button">'+c+'</button>';}).join('');
var cardEls=$$('.card');

function animatePreviews(){
  if(!wrap.classList.contains('open')||st.step!==1){st.raf=0;return;}
  var t=performance.now()/1000;
  cardEls.forEach(function(c){Loy.preview(c.querySelector('canvas'),c.dataset.t,t+(c.dataset.t.length));});
  st.raf=requestAnimationFrame(animatePreviews);
}
function goStep(n){
  st.step=n;
  $$('.pane').forEach(function(p){p.hidden=String(n)!==p.dataset.p;});
  $$('#steps li').forEach(function(li){var s=+li.dataset.s;li.classList.toggle('active',s===n);li.classList.toggle('done',s<n);});
  $('#btnBack').style.visibility=n===1?'hidden':'visible';
  $('#btnNext').hidden=n===3;$('#btnLaunch').hidden=n!==3;
  $('#sumType').textContent=st.type?TYPE_INFO[st.type].name:'-';
  if(n===1&&!st.raf)st.raf=requestAnimationFrame(animatePreviews);
  setTimeout(function(){try{if(n===2)inpName.focus({preventScroll:true});if(n===3)inpWish.focus({preventScroll:true});}catch(e){}},280);
}
function openSheet(n){
  document.body.classList.add('sheet-open');wrap.classList.add('open');wrap.setAttribute('aria-hidden','false');
  goStep(n||1);snd.start();
}
function closeSheet(){wrap.classList.remove('open');wrap.setAttribute('aria-hidden','true');document.body.classList.remove('sheet-open');}
function bad(el,msg,errEl){errEl.textContent=msg;if(el){el.classList.add('bad','shake');setTimeout(function(){el.classList.remove('shake');},450);}return false;}
function validate(n){
  $('#err2').textContent='';$('#err3').textContent='';inpName.classList.remove('bad');inpWish.classList.remove('bad');
  if(n===1&&!st.type){toast('กรุณาเลือกกระทง 1 แบบ');return false;}
  if(n===2&&!inpName.value.trim())return bad(inpName,'กรุณากรอกชื่อ',$('#err2'));
  if(n===3&&CFG.wishRequired&&!inpWish.value.trim())return bad(inpWish,'กรุณากรอกคำอธิษฐาน',$('#err3'));
  return true;
}
cardEls.forEach(function(c){c.addEventListener('click',function(){
  st.type=c.dataset.t;cardEls.forEach(function(x){var on=x===c;x.classList.toggle('sel',on);x.setAttribute('aria-checked',String(on));});
  $('#sumType').textContent=TYPE_INFO[st.type].name;
  setTimeout(function(){if(st.step===1)goStep(2);},380);
});});
$('#btnNext').addEventListener('click',function(){if(validate(st.step))goStep(st.step+1);});
$('#btnBack').addEventListener('click',function(){if(st.step>1)goStep(st.step-1);});
inpName.addEventListener('input',function(){$('#nameCount').textContent=inpName.value.length+'/'+CFG.nameMax;inpName.classList.remove('bad');$('#err2').textContent='';});
inpWish.addEventListener('input',function(){$('#wishCount').textContent=inpWish.value.length+'/'+CFG.wishMax;inpWish.classList.remove('bad');$('#err3').textContent='';});
inpName.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(validate(2))goStep(3);}});
$$('.chip').forEach(function(c){c.addEventListener('click',function(){inpWish.value=c.textContent.slice(0,CFG.wishMax);inpWish.dispatchEvent(new Event('input'));inpWish.focus();});});
$('#btnStart').addEventListener('click',function(){hideThanks();openSheet(1);});
$('#btnClose').addEventListener('click',closeSheet);$('#backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&wrap.classList.contains('open'))closeSheet();});

/* ---------- launch ---------- */
function outbox(){try{return JSON.parse(lsGet(KEY_OUT)||'[]');}catch(e){return[];}}
function saveOutbox(q){lsSet(KEY_OUT,JSON.stringify(q.slice(-20)));}
function flushOutbox(){
  var q=outbox();if(!q.length)return;
  var e=q[0];
  Loy.server('submitKrathong',Object.assign({dev:dev},e),15000).then(function(r){if(r&&(r.ok||r.message)){var cur=outbox();cur.shift();saveOutbox(cur);if(r.total)setTotal(r.total);}}).catch(function(){});
}
setInterval(flushOutbox,20000);setTimeout(flushOutbox,3000);

var wait=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
function launch(){
  if(st.busy)return;
  for(var n=1;n<=3;n++)if(!validate(n)){goStep(n);validate(n);return;}
  st.busy=true;
  var e={id:uid(),type:st.type,name:inpName.value.trim().slice(0,CFG.nameMax),wish:inpWish.value.trim().slice(0,CFG.wishMax),ts:Date.now()};
  var btn=$('#btnLaunch');btn.disabled=true;btn.querySelector('.spin').style.display='inline-block';
  closeSheet();$('#loader').classList.add('show');
  var minWait=wait(1200),pendingLocal=false,failMsg='';
  Loy.server('submitKrathong',Object.assign({dev:dev},e),20000).then(function(r){
    if(r&&r.ok){if(r.total)setTotal(r.total);}
    else failMsg=(r&&r.message)||'ส่งไม่สำเร็จ';
  }).catch(function(){
    var q=outbox();q.push(e);saveOutbox(q);pendingLocal=true;
    toast('สัญญาณไม่เสถียร เก็บกระทงของคุณไว้ แล้วจะส่งซ้ำให้อัตโนมัติ');
  }).then(function(){return minWait;}).then(function(){
    $('#loader').classList.remove('show');btn.disabled=false;btn.querySelector('.spin').style.display='none';st.busy=false;
    if(failMsg){toast(failMsg);openSheet(3);return;}
    inpWish.value='';inpWish.dispatchEvent(new Event('input'));
    recent.push(e);if(recent.length>20)recent.shift();
    if(!navigator.onLine===false&&total===0)setTotal(1);else setTotal(total+(outbox().length?0:0));
    document.body.classList.add('floating');
    scene.add(e,{drop:true,mine:true,d:.74,x:.5,dur:46});
    setTimeout(function(){showThanks(e);},1900);
  });
}
$('#btnLaunch').addEventListener('click',launch);

function showThanks(e){
  $('#thName').textContent=e.name;$('#thType').textContent=TYPE_INFO[e.type].name;
  var w=$('#thWish');w.textContent=e.wish;w.hidden=!e.wish;
  $('#thBless').textContent=CFG.thanksText;
  $('#thanks').classList.add('show');
}
function hideThanks(){$('#thanks').classList.remove('show');document.body.classList.remove('floating');}
$('#btnThClose').addEventListener('click',hideThanks);
$('#btnAgain').addEventListener('click',function(){hideThanks();openSheet(1);});
})();

}
})();
</script>
</body>
</html>
